[package]
name = "fleet-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Fleet CMDB agent: reports host facts to the Fleet CMDB server"
license = "MIT"
publish = false

# Dependencies are added by the issues that first use them; the planned set and the reasons are in
# README.md. Keep this list short: the agent runs as root (DEC-03). No OpenSSL, no async runtime.
[dependencies]
# Syscalls std does not expose: statvfs, uname, getifaddrs for the collectors (P1-AGENT-COLLECT);
# geteuid and O_NOFOLLOW/O_DIRECTORY for the config and state-directory ownership checks (P1-AGENT-CORE);
# flock and termios for the installer's lock and hidden token prompt (P1-AGENT-INSTALL).
libc = "0.2.191"
# Kernel randomness (getrandom(2)) for report ids and jitter seeds. Already linked through ring.
getrandom = "0.2.17"
# RFC 3339 timestamps for payloads and the server's clock; no dependencies of its own.
humantime = "2.4.0"
# Splits command-line arguments (`--opt value`, `--opt=value`, non-UTF-8); no dependencies of its own.
lexopt = "0.3.2"
# The installer's QR code of the approval URL (P1-A10). Pure Rust, no dependencies, no unsafe code.
qrcodegen = "1.8.0"
# Verifies the minisign (Ed25519) signature of a release manifest (P1-PACKAGING, ADR 0018).
# Verify-only, by minisign's author; no dependencies of its own.
minisign-verify = "0.3.0"
# Strict SemVer for release versions, and their ordering for the no-downgrade rule (ADR 0018);
# no dependencies of its own.
semver = "1.0.28"
# SHA-256 for the stable-facts change hash. Already linked as the rustls crypto provider.
ring = { version = "0.17.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SIGTERM/SIGINT for graceful shutdown without an async runtime.
signal-hook = "0.4.5"
# Parse only: the agent never writes TOML.
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
# Text formatter only: no ANSI colours, no env-filter (regex), no `log` bridge.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# UUID formatting for report ids only (no `v4` feature: the bytes come from getrandom); no dependencies.
uuid = { version = "1.29.0", default-features = false }
# rustls with the ring provider; no gzip. Roots come from the system store plus `ca_file`.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

# Test-only, never in the binary.
# jsonschema validates payloads against the API contract in docs/api (P0-CONTRACT); no default
# features, so the validator never fetches remote schemas. rcgen and rustls run a local TLS server
# with a throwaway certificate authority generated per test (P1-A02). minisign generates throwaway
# release keys and signs test manifests, so no key is checked in (P1-PACKAGING).
[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
minisign = "0.10.0"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
