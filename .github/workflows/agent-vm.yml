# Agent update failure tests on disposable Debian 13 VMs (P1-AGENT-UPDATE, P1-A12, ADR 0018).
# Boots Debian's official genericcloud image under QEMU (KVM when the runner allows it, TCG otherwise),
# installs the agent with the real installer, and kills the update supervisor and restarts the VM in
# the middle of updates (agent/scripts/vm-test.sh); runs the apply_package_updates task for real
# against a local repository of test packages (P3-AGENT-UPDATES), and makes a confirmed agent crash-loop
# into recovery mode (#180, ADR 0030).
#
# The scenarios run in independent groups, each on a VM of its own, side by side (#288): see the GROUP
# list in vm-test.sh. Each group builds only the agent versions it needs, into agent/target, which
# Swatinem/rust-cache keeps, so only the agent itself is compiled again. The job "Update failure tests
# on a Debian 13 VM" waits for every group, fails if any did, and gathers their results: the
# "vm-test-results" artifact (JUnit and Markdown per group) and the job summary.
#
# Separate from Agent CI because it takes several minutes; it runs on every change to agent/ and by
# hand (workflow_dispatch). Release keys here are throwaway, generated in the job; none is committed.
name: Agent VM tests

on:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-vm.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-vm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-vm-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debian 13 (trixie) genericcloud, pinned to one dated build. Its SHA-512 is checked against the
  # SHA512SUMS published next to it and against the value pinned here; change both together.
  DEBIAN_CLOUD_BASE: https://cloud.debian.org/images/cloud/trixie
  DEBIAN_IMAGE_BUILD: '20261026-2643'
  DEBIAN_IMAGE_SHA512: '3ace18e33bdd036edb49d1f79342bd01d2ab980e35194edb0b410435cd543538d286a0bd13bbb0835f7862306e3d385ce2f6a70d8ecf0bd961111166adbc1b8e'

jobs:
  vm:
    name: VM tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # builds: normal builds of the versions the group needs; fault_builds: VM fault builds
        # (`--cfg fleet_vm_fault`, src/vm_fault.rs: test-only, never a release). vm-test.sh checks
        # that exactly these have the fault.
        include:
          - group: install
            builds: 1.0.0
            fault_builds: ''
          - group: updates-a
            builds: 1.0.0 1.0.1
            fault_builds: ''
          - group: updates-b
            builds: 1.0.0 1.0.1
            fault_builds: ''
          - group: packages
            builds: ''
            fault_builds: 1.0.0
          - group: recovery
            builds: 1.0.0 1.1.1
            fault_builds: 1.1.0
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the test scripts with shellcheck
        run: shellcheck --version | head -n 2 && shellcheck -x scripts/*.sh

      - name: Self-test the result recording
        # Without a VM: a passing, a failing, and a dying (exit 255) scenario are all recorded.
        run: scripts/vm-test-record-selftest.sh

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools, minisign, and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools minisign qemu-system-x86 qemu-utils genisoimage

      - name: Let the runner user use KVM
        # GitHub's Linux runners expose /dev/kvm to root only; vm-test.sh falls back to TCG without it.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm on this runner: the VM will use TCG"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # agent/target holds the test builds' target directories (target/vm-test, target/vm-test-fault),
          # so their dependencies are cached. One cache per group: each builds a different set.
          workspaces: agent
          key: vm-${{ matrix.group }}

      - name: Build the versions that trust a throwaway key
        # The normal builds share target/vm-test, one after another; the fault builds have their own
        # target directory (their flags differ) and run at the same time, beside them.
        env:
          BUILDS: ${{ matrix.builds }}
          FAULT_BUILDS: ${{ matrix.fault_builds }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/vm-test"
          mkdir -p "$dir"
          minisign -G -W -p "$dir/test.pub" -s "$dir/test.key" > /dev/null
          fault_pid=
          if [ -n "$FAULT_BUILDS" ]; then
            (
              for version in $FAULT_BUILDS; do
                VM_FAULT=1 scripts/update-smoke-build.sh "$version" "$dir/test.pub" "$dir/fleet-agent-$version" "$PWD/target/vm-test-fault"
              done
            ) > "$RUNNER_TEMP/fault-build.log" 2>&1 &
            fault_pid=$!
          fi
          for version in $BUILDS; do
            scripts/update-smoke-build.sh "$version" "$dir/test.pub" "$dir/fleet-agent-$version" "$PWD/target/vm-test"
          done
          if [ -n "$fault_pid" ]; then
            status=0
            wait "$fault_pid" || status=$?
            echo "::group::Fault builds"
            cat "$RUNNER_TEMP/fault-build.log"
            echo "::endgroup::"
            [ "$status" = 0 ] || { echo "::error::the fault build failed (exit $status)"; exit 1; }
          fi
          ls -l "$dir"

      - name: Find the image and its published checksum
        id: image
        run: |
          set -eu
          if [ -z "$DEBIAN_IMAGE_BUILD" ]; then
            echo "DEBIAN_IMAGE_BUILD is not pinned. Recent builds:"
            curl -fsSL "$DEBIAN_CLOUD_BASE/" | grep -oE 'href="[0-9]{8}-[0-9]{4}/"' | sed 's/href="//; s/\/"//' | sort | tail -n 5
            exit 1
          fi
          name="debian-13-genericcloud-amd64-$DEBIAN_IMAGE_BUILD.qcow2"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA512SUMS" "$DEBIAN_CLOUD_BASE/$DEBIAN_IMAGE_BUILD/SHA512SUMS"
          published=$(awk -v n="$name" '$2 == n { print $1 }' "$RUNNER_TEMP/SHA512SUMS")
          if [ -z "$published" ]; then
            echo "::error::$name is not in the published SHA512SUMS"
            exit 1
          fi
          echo "published SHA-512 of $name: $published"
          if [ "$published" != "$DEBIAN_IMAGE_SHA512" ]; then
            echo "::error::the published SHA-512 of $name differs from the one pinned in agent-vm.yml"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha512=$published" >> "$GITHUB_OUTPUT"

      - name: Restore the image from the cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/debian-image
          key: debian13-genericcloud-${{ steps.image.outputs.sha512 }}

      - name: Download and verify the image
        env:
          NAME: ${{ steps.image.outputs.name }}
          SHA512: ${{ steps.image.outputs.sha512 }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/debian-image"
          image="$RUNNER_TEMP/debian-image/$NAME"
          if [ ! -s "$image" ]; then
            curl -fsSL --retry 3 -o "$image" "$DEBIAN_CLOUD_BASE/$DEBIAN_IMAGE_BUILD/$NAME"
          fi
          echo "$SHA512  $image" | sha512sum -c -

      - name: Run the scenarios of the group
        env:
          NAME: ${{ steps.image.outputs.name }}
          GROUP: ${{ matrix.group }}
        run: scripts/vm-test.sh "$RUNNER_TEMP/vm-test" "$RUNNER_TEMP/debian-image/$NAME" "$RUNNER_TEMP/vm-test-results" "$GROUP"

      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/vm-test-results/results.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vm-test-results-${{ matrix.group }}
          path: ${{ runner.temp }}/vm-test-results
          if-no-files-found: warn
          retention-days: 90

  results:
    # The check that stands for all the groups: green only when every group passed.
    name: Update failure tests on a Debian 13 VM
    needs: vm
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the groups' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vm-test-results-*
          path: vm-test-results

      - name: Job summary
        run: |
          for file in vm-test-results/*/results.md; do
            [ -s "$file" ] || continue
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vm-test-results
          path: vm-test-results
          if-no-files-found: warn
          retention-days: 90

      - name: Every group passed
        env:
          RESULT: ${{ needs.vm.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::a VM test group did not pass ($RESULT): see the VM tests jobs"
            exit 1
          fi
          echo "every VM test group passed"
