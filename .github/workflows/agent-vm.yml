# Agent update failure tests on a disposable Debian 13 VM (P1-AGENT-UPDATE, P1-A12, ADR 0018).
# Boots Debian's official genericcloud image under QEMU (KVM when the runner allows it, TCG otherwise),
# installs the agent with the real installer, and kills the update supervisor and restarts the VM in
# the middle of updates (agent/scripts/vm-test.sh). The results are uploaded as the "vm-test-results"
# artifact (JUnit and Markdown) and shown in the job summary.
#
# Separate from Agent CI because it takes several minutes; it runs on every change to agent/ and by
# hand (workflow_dispatch). Release keys here are throwaway, generated in the job; none is committed.
name: Agent VM tests

on:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-vm.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-vm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-vm-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debian 13 (trixie) genericcloud, pinned to one dated build. Its SHA-512 is checked against the
  # SHA512SUMS published next to it and against the value pinned here; change both together.
  DEBIAN_CLOUD_BASE: https://cloud.debian.org/images/cloud/trixie
  DEBIAN_IMAGE_BUILD: '20261026-2643'
  DEBIAN_IMAGE_SHA512: '3ace18e33bdd036edb49d1f79342bd01d2ab980e35194edb0b410435cd543538d286a0bd13bbb0835f7862306e3d385ce2f6a70d8ecf0bd961111166adbc1b8e'

jobs:
  vm:
    name: Update failure tests on a Debian 13 VM
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the test scripts with shellcheck
        run: shellcheck --version | head -n 2 && shellcheck -x scripts/*.sh

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools, minisign, and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools minisign qemu-system-x86 qemu-utils genisoimage

      - name: Let the runner user use KVM
        # GitHub's Linux runners expose /dev/kvm to root only; vm-test.sh falls back to TCG without it.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm on this runner: the VM will use TCG"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
          key: vm

      - name: Build two versions that trust a throwaway key
        run: |
          set -eu
          dir="$RUNNER_TEMP/vm-test"
          mkdir -p "$dir"
          minisign -G -W -p "$dir/test.pub" -s "$dir/test.key" > /dev/null
          scripts/update-smoke-build.sh 1.0.0 "$dir/test.pub" "$dir/fleet-agent-1.0.0" "$RUNNER_TEMP/vm-target"
          scripts/update-smoke-build.sh 1.0.1 "$dir/test.pub" "$dir/fleet-agent-1.0.1" "$RUNNER_TEMP/vm-target"

      - name: Find the image and its published checksum
        id: image
        run: |
          set -eu
          if [ -z "$DEBIAN_IMAGE_BUILD" ]; then
            echo "DEBIAN_IMAGE_BUILD is not pinned. Recent builds:"
            curl -fsSL "$DEBIAN_CLOUD_BASE/" | grep -oE 'href="[0-9]{8}-[0-9]{4}/"' | sed 's/href="//; s/\/"//' | sort | tail -n 5
            exit 1
          fi
          name="debian-13-genericcloud-amd64-$DEBIAN_IMAGE_BUILD.qcow2"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA512SUMS" "$DEBIAN_CLOUD_BASE/$DEBIAN_IMAGE_BUILD/SHA512SUMS"
          published=$(awk -v n="$name" '$2 == n { print $1 }' "$RUNNER_TEMP/SHA512SUMS")
          if [ -z "$published" ]; then
            echo "::error::$name is not in the published SHA512SUMS"
            exit 1
          fi
          echo "published SHA-512 of $name: $published"
          if [ "$published" != "$DEBIAN_IMAGE_SHA512" ]; then
            echo "::error::the published SHA-512 of $name differs from the one pinned in agent-vm.yml"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha512=$published" >> "$GITHUB_OUTPUT"

      - name: Restore the image from the cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/debian-image
          key: debian13-genericcloud-${{ steps.image.outputs.sha512 }}

      - name: Download and verify the image
        env:
          NAME: ${{ steps.image.outputs.name }}
          SHA512: ${{ steps.image.outputs.sha512 }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/debian-image"
          image="$RUNNER_TEMP/debian-image/$NAME"
          if [ ! -s "$image" ]; then
            curl -fsSL --retry 3 -o "$image" "$DEBIAN_CLOUD_BASE/$DEBIAN_IMAGE_BUILD/$NAME"
          fi
          echo "$SHA512  $image" | sha512sum -c -

      - name: Kill and reboot in the middle of updates
        env:
          NAME: ${{ steps.image.outputs.name }}
        run: scripts/vm-test.sh "$RUNNER_TEMP/vm-test" "$RUNNER_TEMP/debian-image/$NAME" "$RUNNER_TEMP/vm-test-results"

      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/vm-test-results/results.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vm-test-results
          path: ${{ runner.temp }}/vm-test-results
          if-no-files-found: warn
          retention-days: 90
