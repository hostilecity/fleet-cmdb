# Agent CI (issue P0-AGENT, FR-1.6, NFR-4).
# Runs cargo fmt, clippy, tests, a dependency audit, the systemd unit check, the static musl release
# build for each target in DEC-01 (x86_64-unknown-linux-musl only) with a reproducibility check, a release
# dry run with a throwaway key, the sandbox smoke test (the musl binary under the unit, on systemd), and
# the update smoke test (a supervised agent update and its rollbacks on systemd, P1-AGENT-UPDATE; agent
# changes and pushes to main only, in three parallel groups).
# Pushes to main upload the binary as a workflow artefact (built with the release keys in
# agent/release-keys, unsigned). Signed releases are published only by agent-release.yml, on a version
# tag, after the owner's approval (P1-PACKAGING, ADR 0018); nothing here has access to the release key.
#
# Branch protection should require the "Agent CI" job only. It always runs and passes when
# agent/ was not touched, so path filtering never leaves a required check pending.
name: Agent CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files through the API

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect agent changes
    runs-on: ubuntu-latest
    outputs:
      # Pushes to main always run the full check; pull requests only when agent/, docs/api/, or this workflow changed.
      agent: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.agent }}
      # The update smoke test exercises the agent binary only, so a pull request that changes nothing but the
      # API contract (most server work) skips it; the contract tests in "fmt, clippy, test" still run then.
      update: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.update }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            agent:
              - 'agent/**'
              - '.github/workflows/agent-ci.yml'
              - '.github/workflows/agent-release.yml'
              - 'docs/api/**' # shared API contract (P0-CONTRACT)
            update:
              - 'agent/**'
              - '.github/workflows/agent-ci.yml'

  check:
    name: fmt, clippy, test
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain (agent/rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Fails on any RustSec advisory (vulnerable, unmaintained, or yanked crate) in Cargo.lock.
        run: cargo audit --deny warnings

  build:
    name: Release build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # DEC-01. Add a target here only with a new decision.
        target: [x86_64-unknown-linux-musl]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Install musl tools and minisign
        # musl-tools: needed once a dependency compiles C code. minisign: the release dry run below.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools minisign

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: ${{ matrix.target }}

      - name: Build the release binary
        # As the release workflow builds it: reproducibly (scripts/build-release.sh).
        run: scripts/build-release.sh ${{ matrix.target }}

      - name: Check the build is reproducible
        # The release workflow signs only if two independent builds are byte-identical (review of #72);
        # building again in another directory here catches a change that breaks that before a tag does.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          first=$(sha256sum "target/$TARGET/release/fleet-agent" | cut -d ' ' -f 1)
          again=$(scripts/build-release.sh "$TARGET" "$RUNNER_TEMP/rebuild")
          second=$(sha256sum "$again" | cut -d ' ' -f 1)
          echo "first build:  $first"
          echo "second build: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::the release build is not reproducible: two builds of the same commit differ"
            exit 1
          fi

      - name: Check the binary is static and runs
        env:
          BIN: target/${{ matrix.target }}/release/fleet-agent
        run: |
          file "$BIN"
          file "$BIN" | grep -Eq '(statically|static-pie) linked'
          "$BIN" --version
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "fleet-agent") | .version')
          "$BIN" --version | grep -Eqx "fleet-agent $VERSION \(agent schema [0-9]+\)"

      - name: Upload binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: fleet-agent-${{ matrix.target }}
          path: agent/target/${{ matrix.target }}/release/fleet-agent
          if-no-files-found: error
          retention-days: 30

      - name: Release dry run with a throwaway key
        # The release pipeline end to end, as agent-release.yml runs it, but with a key pair generated
        # here and discarded: embed the public key, build, write the manifest, sign it with minisign,
        # and verify it with the agent's own `verify-release`. Runs after the upload, so the published
        # artefact never contains this key; the key file is restored at the end.
        env:
          TARGET: ${{ matrix.target }}
          BIN: target/${{ matrix.target }}/release/fleet-agent
        run: |
          set -eu
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"; git checkout -- release-keys/current.pub' EXIT
          minisign -G -W -p "$tmp/test.pub" -s "$tmp/test.key" > /dev/null
          cp "$tmp/test.pub" release-keys/current.pub
          scripts/build-release.sh "$TARGET" > /dev/null
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "fleet-agent") | .version')
          scripts/release-manifest.sh "$VERSION" "$TARGET" "$BIN" > "$tmp/manifest.json"
          minisign -S -s "$tmp/test.key" -m "$tmp/manifest.json" -t "fleet-agent $VERSION $TARGET dry run" > /dev/null
          "$BIN" verify-release --manifest "$tmp/manifest.json" --signature "$tmp/manifest.json.minisig" --binary "$BIN"
          # A changed manifest must not verify.
          sed 's/"size":/"size":1/' "$tmp/manifest.json" > "$tmp/changed.json"
          if "$BIN" verify-release --manifest "$tmp/changed.json" --signature "$tmp/manifest.json.minisig" --binary "$BIN"; then
            echo "::error::a changed manifest verified"
            exit 1
          fi

  unit:
    name: systemd unit
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: systemd-analyze verify and security
        # Fails on any warning from `verify`, or an exposure score above 2.0 (P1-PACKAGING).
        run: scripts/check-unit.sh src/install/fleet-agent.service

  sandbox:
    name: Sandbox smoke test (musl binary under the unit)
    # The shipped musl binary, run as a transient systemd service with every sandbox option of the unit,
    # against a local stand-in for the agent API, and compared with an unsandboxed run: the sandbox must
    # not cost a single fact (scripts/sandbox-smoke.sh, review of #72). GitHub's Ubuntu runners run systemd.
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: sandbox

      - name: Build the release binary
        run: scripts/build-release.sh x86_64-unknown-linux-musl

      - name: Run it under the unit's sandbox
        # sudo resets the environment; GITHUB_ACTIONS turns on the script's annotations.
        run: sudo GITHUB_ACTIONS=true scripts/sandbox-smoke.sh target/x86_64-unknown-linux-musl/release/fleet-agent src/install/fleet-agent.service

  update:
    name: Update smoke test (${{ matrix.group }})
    # The agent updating itself on a real systemd (P1-AGENT-UPDATE, ADR 0018): the real unit files and
    # layout, two builds of the musl agent that trust a throwaway release key generated here, and a local
    # stand-in for the API and the release channel. A good release is installed; tampered, unsigned,
    # wrongly signed, older, failing, crash-looping, and unauthenticated releases are refused or rolled
    # back; a killed supervisor is resumed or backstopped by the OnFailure unit; an agent below the
    # server's minimum version still updates (scripts/update-smoke.sh). No private key is committed:
    # the keys exist only in the runner's temporary directory. The scenarios run in three groups side by
    # side; each job builds its own two versions (cached), so the throwaway keys never leave its runner.
    needs: changes
    if: needs.changes.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [refusals, rollbacks, recovery]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools and minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools minisign

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: update

      - name: Build two versions that trust a throwaway key
        run: |
          set -eu
          dir="$RUNNER_TEMP/update-smoke"
          mkdir -p "$dir"
          minisign -G -W -p "$dir/test.pub" -s "$dir/test.key" > /dev/null
          minisign -G -W -p "$dir/other.pub" -s "$dir/other.key" > /dev/null
          scripts/update-smoke-build.sh 1.0.0 "$dir/test.pub" "$dir/fleet-agent-1.0.0" "$RUNNER_TEMP/update-smoke-target"
          scripts/update-smoke-build.sh 1.0.1 "$dir/test.pub" "$dir/fleet-agent-1.0.1" "$RUNNER_TEMP/update-smoke-target"

      - name: Update, refuse, and roll back under systemd
        # sudo resets the environment; GITHUB_ACTIONS turns on the script's annotations and its
        # permission to rewrite /usr/lib/fleet-agent, /etc/fleet-agent and /etc/systemd/system.
        env:
          GROUP: ${{ matrix.group }}
        run: sudo GITHUB_ACTIONS=true scripts/update-smoke.sh "$RUNNER_TEMP/update-smoke" "$GROUP"

  gate:
    name: Agent CI
    needs: [changes, check, audit, build, unit, sandbox, update]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          AUDIT: ${{ needs.audit.result }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit.result }}
          SANDBOX: ${{ needs.sandbox.result }}
          UPDATE: ${{ needs.update.result }}
        run: |
          echo "changes=$CHANGES check=$CHECK audit=$AUDIT build=$BUILD unit=$UNIT sandbox=$SANDBOX update=$UPDATE"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          for r in "$CHECK" "$AUDIT" "$BUILD" "$UNIT" "$SANDBOX" "$UPDATE"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
