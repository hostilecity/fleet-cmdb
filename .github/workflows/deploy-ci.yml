# Deploy CI (P1-O03): checks the production image the way .github/workflows/cd.yml runs it. Builds it, starts a
# throwaway PostgreSQL 17 with the role cmdb owning the four databases (as on the server), runs the image with an
# env file, the database network, and a published port, waits for /up, and checks that the dashboard hostname serves
# sign-in and refuses /api/v1, also with a forged X-Forwarded-Host. Then runs it as cd.yml does with
# FLEET_JOBS_CONTAINER=true (#198): the app without jobs, and a jobs container whose realtime worker runs the
# every-minute liveness evaluation. Then sets up backups as cd.yml does on the VM (#138): the backup env file and
# ops/backup/install.sh, with the runner user standing in for the deploy user (lingering on, so its systemd user
# timer runs), takes a backup through the user unit onto a mounted backup location, checks that /health reports it,
# runs the restore drill (it fails clearly until the role cmdb has CREATEDB, as provisioned, then passes), and
# recovers a lost server with docker.sh restore into freshly provisioned empty databases and a new volume. Also lints
# the deploy workflows and ops scripts.
#
# Branch protection may require the "Deploy CI" job. It always runs and passes when nothing it checks changed.
name: Deploy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files through the API

concurrency:
  group: deploy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deployment changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.deploy }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            deploy:
              - 'cmdb/**'
              - 'docs/api/**'
              - 'ops/**'
              - 'agent/trust/**'
              - '.github/workflows/cd.yml'
              - '.github/workflows/deploy-ci.yml'

  image:
    name: Image check
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DASHBOARD: fleet.example.com
      AGENT: agent.fleet.example.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint (actionlint also shellchecks the workflows' scripts)
        run: |
          shellcheck ops/backup/*.sh
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/cd.yml .github/workflows/deploy-ci.yml

      - name: Build the image (as cd.yml does)
        run: docker build -q --build-context api=docs/api --build-context trust=agent/trust --build-context release-keys=agent/release-keys -t fleet-cmdb:ci cmdb

      - name: Start PostgreSQL with the role cmdb and its four databases
        run: |
          password="$(openssl rand -hex 24)"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"
          docker network create fleet-db
          docker run -d --name postgres --network fleet-db -e POSTGRES_PASSWORD="$(openssl rand -hex 24)" postgres:17
          for _ in $(seq 1 60); do docker exec postgres pg_isready -q -U postgres && break; sleep 1; done
          docker exec -i postgres psql -q -v ON_ERROR_STOP=1 -U postgres <<SQL
          CREATE ROLE cmdb LOGIN PASSWORD '$password';
          CREATE DATABASE cmdb_production OWNER cmdb;
          CREATE DATABASE cmdb_production_cache OWNER cmdb;
          CREATE DATABASE cmdb_production_queue OWNER cmdb;
          CREATE DATABASE cmdb_production_cable OWNER cmdb;
          SQL

      - name: Make a throwaway certificate authority and a certificate for the agent hostname
        # Stands in for the Cloudflare Origin CA certificate (ADR 0024): signed by a CA, for the agent hostname only.
        run: |
          tls="$RUNNER_TEMP/tls" && mkdir -p "$tls" && cd "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj "/CN=Deploy CI CA" -keyout ca.key -out ca.pem 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj "/CN=$AGENT" -keyout server.key -out server.csr 2>/dev/null
          printf 'subjectAltName=DNS:%s\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' "$AGENT" > ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -extfile ext -out server.pem 2>/dev/null
          echo "TLS_DIR=$tls" >> "$GITHUB_ENV"

      - name: Run the image (as cd.yml does) and wait for /up
        run: |
          # Kept for the jobs-container check (cd.yml's settings without SOLID_QUEUE_IN_PUMA), deleted there.
          (umask 077 && printf '%s\n' PGHOST=postgres "DATABASE_PASSWORD=$DB_PASSWORD" \
            "SECRET_KEY_BASE=$(openssl rand -hex 64)" "FLEET_ENCRYPTION_KEY=$(openssl rand -hex 32)" GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com \
            GOOGLE_CLIENT_SECRET=ci "FLEET_DASHBOARD_HOST=$DASHBOARD" "FLEET_AGENT_HOST=$AGENT" \
            "FLEET_TLS_CERT_BASE64=$(base64 -w0 "$TLS_DIR/server.pem")" "FLEET_TLS_KEY_BASE64=$(base64 -w0 "$TLS_DIR/server.key")" \
            > "$RUNNER_TEMP/fleet-cmdb-nojobs.env"
           { echo SOLID_QUEUE_IN_PUMA=1; cat "$RUNNER_TEMP/fleet-cmdb-nojobs.env"; } > "$RUNNER_TEMP/fleet-cmdb.env")
          docker volume create fleet-cmdb_storage
          docker run -d --name fleet-cmdb -p 127.0.0.1:8443:3443 --network fleet-db \
            --cap-drop ALL --security-opt no-new-privileges \
            -v fleet-cmdb_storage:/rails/storage --env-file "$RUNNER_TEMP/fleet-cmdb.env" fleet-cmdb:ci
          rm -f "$RUNNER_TEMP/fleet-cmdb.env"
          for _ in $(seq 1 60); do
            if docker exec fleet-cmdb curl -fsS -o /dev/null http://localhost:3000/up 2>/dev/null; then exit 0; fi
            sleep 3
          done
          docker logs --tail 200 fleet-cmdb
          exit 1

      - name: Check HTTPS and both hostnames
        run: |
          failed=0
          expect() { if [ "$2" = "$3" ]; then echo "ok   $1"; else echo "FAIL $1: expected '$2', got '$3'"; failed=1; fi; }
          # As cloudflared and agents connect: to the agent hostname, verifying its certificate against the CA. The tunnel
          # passes the browser's hostname in Host, so dashboard requests carry the dashboard hostname over the same connection.
          code() { curl -s -o /dev/null -w '%{http_code}' --cacert "$TLS_DIR/ca.pem" --resolve "$AGENT:8443:127.0.0.1" "$@"; }
          url="https://$AGENT:8443"
          expect "the certificate verifies for the agent hostname" 200 "$(code "$url/up")"
          expect "TLS 1.1 and older are refused" 35 "$(curl -s -o /dev/null --tls-max 1.1 --cacert "$TLS_DIR/ca.pem" --resolve "$AGENT:8443:127.0.0.1" "$url/up"; echo $?)"
          expect "the deploy's HTTPS readiness check passes (cd.yml)" 0 "$(docker exec fleet-cmdb curl -fsSk -o /dev/null https://localhost:3443/up; echo $?)"
          expect "plain HTTP is not published" 7 "$(curl -s -o /dev/null http://127.0.0.1:8080/up; echo $?)"
          expect "the agent API answers on the agent hostname" 401 "$(code -X POST -H "Content-Type: application/json" -d '{}' "$url/api/v1/heartbeat")"
          expect "the dashboard is 404 on the agent hostname" 404 "$(code "$url/sign_in")"
          expect "the sign-in page renders" 200 "$(code -H "Host: $DASHBOARD" "$url/sign_in")"
          expect "the dashboard redirects to sign-in" "302 https://$DASHBOARD/sign_in" \
            "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --cacert "$TLS_DIR/ca.pem" --resolve "$AGENT:8443:127.0.0.1" -H "Host: $DASHBOARD" "$url/")"
          expect "/api/v1 on the dashboard hostname is 404" 404 "$(code -X POST -H "Host: $DASHBOARD" "$url/api/v1/heartbeat")"
          expect "a forged X-Forwarded-Host is ignored" 404 \
            "$(code -X POST -H "Host: $DASHBOARD" -H "X-Forwarded-Host: $AGENT" "$url/api/v1/heartbeat")"
          expect "a forged Forwarded host is ignored" 404 \
            "$(code -X POST -H "Host: $DASHBOARD" -H "Forwarded: host=$AGENT" "$url/api/v1/heartbeat")"
          expect "/health on the dashboard hostname is 404" 404 "$(code -H "Host: $DASHBOARD" "$url/health")"
          expect "the storage volume belongs to the app" 1000 "$(docker exec fleet-cmdb stat -c %u /rails/storage/releases)"
          # Container hardening (server assessment): the app owns only what it writes, has no capabilities, cannot gain
          # privileges, and the image carries no test or development gems.
          expect "the app runs as uid 1000" 1000 "$(docker exec fleet-cmdb id -u)"
          expect "the app has no capabilities" 0000000000000000 "$(docker exec fleet-cmdb sed -n 's/^CapEff:[[:space:]]*//p' /proc/1/status)"
          expect "the app cannot gain privileges" 1 "$(docker exec fleet-cmdb sed -n 's/^NoNewPrivs:[[:space:]]*//p' /proc/1/status)"
          # yes or no for the app user creating a file in the directory; the container's shell expands a pattern
          # first (review of #184), and a directory that is not there is "missing", which fails either way.
          writable() {
            docker exec fleet-cmdb sh -c 'for d in $1; do
              [ -d "$d" ] || { echo missing; exit 0; }
              if touch "$d/.probe" 2>/dev/null; then rm -f "$d/.probe"; echo yes; else echo no; fi; exit 0
            done' sh "$1"
          }
          for dir in /rails/app /rails/config /rails/bin /usr/local/bundle '/usr/local/bundle/ruby/*/gems'; do
            expect "the app cannot write $dir" no "$(writable "$dir")"
          done
          for dir in /rails/tmp /rails/log /rails/storage; do
            expect "the app can write $dir" yes "$(writable "$dir")"
          done
          expect "the image has no test gems" 0 "$(docker exec fleet-cmdb sh -c 'ls /usr/local/bundle/ruby/*/gems | grep -c -e "^rspec-core-" -e "^webmock-" -e "^brakeman-"')"
          health="$(docker exec fleet-cmdb curl -s -w ' %{http_code}' http://localhost:3000/health)"
          echo "/health: $health"
          expect "/health is 503 until a backup exists" 503 "${health##* }"
          if [ "$failed" -ne 0 ]; then docker logs --tail 100 fleet-cmdb; exit 1; fi

      - name: Run jobs in their own container (as cd.yml does with FLEET_JOBS_CONTAINER=true)
        run: |
          failed=0
          expect() { if [ "$2" = "$3" ]; then echo "ok   $1"; else echo "FAIL $1: expected '$2', got '$3'"; failed=1; fi; }
          queue() { docker exec postgres psql -U postgres -d cmdb_production_queue -Atc "$1"; }
          # Solid Queue's workers inside the app container, as deployed by default: one for realtime, one for the default queue
          # (and Solid Queue's recurring commands, and realtime when free), and one for fleet-wide evaluation (#197).
          for _ in $(seq 1 30); do [ "$(queue "SELECT count(*) FROM solid_queue_processes WHERE kind = 'Worker'")" = 3 ] && break; sleep 2; done
          expect "the app container runs a realtime, a default, and an evaluation worker" "default,solid_queue_recurring,realtime,evaluation,realtime" \
            "$(queue "SELECT string_agg(metadata::json->>'queues', ',' ORDER BY metadata::json->>'queues') FROM solid_queue_processes WHERE kind = 'Worker'")"

          docker rm -f fleet-cmdb >/dev/null
          queue "DELETE FROM solid_queue_processes; DELETE FROM solid_queue_jobs" >/dev/null
          docker run -d --name fleet-cmdb -p 127.0.0.1:8443:3443 --network fleet-db \
            -v fleet-cmdb_storage:/rails/storage --env-file "$RUNNER_TEMP/fleet-cmdb-nojobs.env" fleet-cmdb:ci >/dev/null
          for _ in $(seq 1 60); do docker exec fleet-cmdb curl -fsS -o /dev/null http://localhost:3000/up 2>/dev/null && break; sleep 3; done
          # As cd.yml does: the jobs container's settings are the app's without the TLS certificate and key.
          (umask 077 && grep -v '^FLEET_TLS_' "$RUNNER_TEMP/fleet-cmdb-nojobs.env" > "$RUNNER_TEMP/fleet-cmdb-jobs.env")
          docker run -d --name fleet-cmdb-jobs --network fleet-db --cap-drop ALL --security-opt no-new-privileges \
            -v fleet-cmdb_storage:/rails/storage --env-file "$RUNNER_TEMP/fleet-cmdb-jobs.env" fleet-cmdb:ci ./bin/jobs >/dev/null
          rm -f "$RUNNER_TEMP/fleet-cmdb-nojobs.env" "$RUNNER_TEMP/fleet-cmdb-jobs.env"
          expect "the jobs container has no TLS key or certificate" 0 "$(docker exec fleet-cmdb-jobs env | grep -c '^FLEET_TLS_')"
          expect "the app container still has both" 2 "$(docker exec fleet-cmdb env | grep -c '^FLEET_TLS_')"

          jobs_host="$(docker inspect -f '{{.Config.Hostname}}' fleet-cmdb-jobs)"
          # The scheduler enqueues the liveness evaluation every minute; the jobs container's realtime worker runs it.
          for _ in $(seq 1 50); do
            [ "$(queue "SELECT count(*) FROM solid_queue_jobs WHERE class_name = 'LivenessEvaluationJob' AND finished_at IS NOT NULL")" != 0 ] && break
            sleep 3
          done
          expect "the liveness evaluation ran on the realtime queue" realtime \
            "$(queue "SELECT string_agg(DISTINCT queue_name, ',') FROM solid_queue_jobs WHERE class_name = 'LivenessEvaluationJob' AND finished_at IS NOT NULL")"
          expect "every Solid Queue process is in the jobs container" "$jobs_host" "$(queue "SELECT string_agg(DISTINCT hostname, ',') FROM solid_queue_processes")"
          expect "the jobs container runs a realtime, a default, and an evaluation worker" "default,solid_queue_recurring,realtime,evaluation,realtime" \
            "$(queue "SELECT string_agg(metadata::json->>'queues', ',' ORDER BY metadata::json->>'queues') FROM solid_queue_processes WHERE kind = 'Worker'")"
          expect "the jobs container is running" "true 0" "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' fleet-cmdb-jobs)"
          health="$(docker exec fleet-cmdb curl -s http://localhost:3000/health)"
          echo "/health: $health"
          expect "/health sees the jobs container's liveness evaluation" ok "$(printf '%s' "$health" | sed -n 's/.*"job_liveness":"\([a-z]*\)".*/\1/p')"
          if [ "$failed" -ne 0 ]; then docker logs --tail 100 fleet-cmdb-jobs; exit 1; fi

      - name: Back up, run the restore drill, and restore, as deployed (#138)
        run: |
          failed=0
          expect() { if [ "$2" = "$3" ]; then echo "ok   $1"; else echo "FAIL $1: expected '$2', got '$3'"; failed=1; fi; }
          contains() { if [[ "$3" == *"$2"* ]]; then echo "ok   $1"; else echo "FAIL $1: '$2' not in: $3"; failed=1; fi; }
          stop() { echo "FAIL $1"; sudo journalctl --no-pager -n 60 _SYSTEMD_USER_UNIT=fleet-cmdb-backup.service || true; exit 1; }
          health() { docker exec fleet-cmdb curl -s http://localhost:3000/health; }
          wait_backup_ok() { for _ in $(seq 1 20); do [[ "$(health)" == *'"backup":"ok"'* ]] && return 0; sleep 3; done; return 1; }
          dbs() { docker exec postgres psql -U postgres -Atc "$1"; }
          backups=/var/backups/fleet-cmdb
          tool="$HOME/.local/share/fleet-cmdb/backup/docker.sh"

          echo "== data for the drill: an operator (an audit entry), a host, and a file in the release directory"
          docker exec fleet-cmdb bin/rails operators:allow EMAIL=operator@example.com
          docker exec fleet-cmdb bin/rails hosts:create DISPLAY_NAME="Deploy CI" VM_HOSTNAME=vm-01.example.lan > /dev/null
          docker exec fleet-cmdb sh -c 'echo ci > /rails/storage/releases/deploy-ci-marker'

          echo "== install as cd.yml does: the env file (mode 0600), then install.sh"
          (umask 077 && mkdir -p "$HOME/.config/fleet-cmdb" && printf '%s\n' FLEET_DB_NETWORK=fleet-db PGHOST=postgres PGUSER=cmdb \
            "PGPASSWORD=$DB_PASSWORD" "BACKUP_DIR=$backups" BACKUP_PG_IMAGE=postgres:17 > "$HOME/.config/fleet-cmdb/backup.env")
          contains "install.sh refuses without lingering" "loginctl enable-linger" "$(bash ops/backup/install.sh 2>&1 || true)"
          sudo loginctl enable-linger "$USER" # the owner's one-time step on the VM
          bash ops/backup/install.sh
          XDG_RUNTIME_DIR="/run/user/$(id -u)" && export XDG_RUNTIME_DIR
          expect "the timer is enabled" enabled "$(systemctl --user is-enabled fleet-cmdb-backup.timer)"
          expect "the timer is waiting" active "$(systemctl --user is-active fleet-cmdb-backup.timer)"

          echo "== the backup location is checked on the VM"
          contains "a missing location is refused" "does not exist" "$("$tool" backup 2>&1 || true)"
          sudo install -d -m 0700 -o 1000 -g 1000 "$backups"
          contains "a location that is not a mount point is refused" "not a mount point" "$("$tool" backup 2>&1 || true)"
          expect "nothing was written" "" "$(sudo ls -A "$backups")"
          sudo mount -t tmpfs -o size=512m,mode=0700,uid=1000,gid=1000 tmpfs "$backups" # stands in for the off-machine mount

          echo "== a backup through the systemd unit, as the timer runs it"
          systemctl --user start fleet-cmdb-backup.service || stop "the backup failed"
          sudo journalctl --no-pager -n 20 _SYSTEMD_USER_UNIT=fleet-cmdb-backup.service || true
          set_name="$(sudo ls "$backups" | grep '^fleet-cmdb-' || true)"
          expect "one backup set" 1 "$(printf '%s' "$set_name" | grep -c . || true)"
          expect "it holds the four databases, the release files, the counts, and checksums" \
            "SHA256SUMS cable.dump cache.dump counts fleet-cmdb.dump queue.dump releases.tar" "$(sudo ls "$backups/$set_name" | xargs)"
          expect "the set belongs to the app's uid, mode 0700" "1000 700" "$(sudo stat -c '%u %a' "$backups/$set_name")"
          expect "the release files are in it" 1 "$(sudo tar -tf "$backups/$set_name/releases.tar" | grep -c deploy-ci-marker || true)"
          expect "the counts include the host" hosts=1 "$(sudo grep '^hosts=' "$backups/$set_name/counts")"
          expect "the status file is in the storage volume" 0 "$(docker exec fleet-cmdb test -f /rails/storage/backup/last_success; echo $?)"
          wait_backup_ok || failed=1
          echo "/health: $(health)"
          expect "/health reports the backup" ok "$(health | sed -n 's/.*"backup":"\([a-z]*\)".*/\1/p')"
          expect "the database password is not in the backup's log" 0 \
            "$(sudo journalctl --no-pager _SYSTEMD_USER_UNIT=fleet-cmdb-backup.service | grep -cF "$DB_PASSWORD" || true)"

          echo "== the restore drill"
          out="$("$tool" restore-drill 2>&1)" && rc=0 || rc=$?
          echo "$out" | tail -n 3
          expect "without CREATEDB the drill fails" 1 "$rc"
          contains "and says what to run" "ALTER ROLE cmdb CREATEDB;" "$out"
          dbs "ALTER ROLE cmdb CREATEDB" > /dev/null # the owner's one-time step in PostgreSQL
          out="$("$tool" restore-drill 2>&1)" && rc=0 || rc=$?
          echo "$out"
          expect "the restore drill passes" 0 "$rc"
          contains "against the restored data" "Restore drill passed." "$out"
          contains "the queue database was restored too" "queue.dump restored into" "$out"
          expect "no scratch database is left" 0 "$(dbs "SELECT count(*) FROM pg_database WHERE datname LIKE 'cmdb_restore_drill%'")"
          expect "no scratch volume is left" "" "$(docker volume ls -q --filter name=fleet-cmdb-drill)"

          echo "== recover a lost server: re-provisioned empty databases, a new volume, docker.sh restore"
          (umask 077 && { docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' fleet-cmdb | grep .; echo SOLID_QUEUE_IN_PUMA=1; } > "$RUNNER_TEMP/restore.env")
          docker rm -f fleet-cmdb-jobs fleet-cmdb > /dev/null
          docker volume rm fleet-cmdb_storage > /dev/null
          docker exec -i postgres psql -q -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          DROP DATABASE cmdb_production WITH (FORCE);
          DROP DATABASE cmdb_production_cache WITH (FORCE);
          DROP DATABASE cmdb_production_queue WITH (FORCE);
          DROP DATABASE cmdb_production_cable WITH (FORCE);
          CREATE DATABASE cmdb_production OWNER cmdb;
          CREATE DATABASE cmdb_production_cache OWNER cmdb;
          CREATE DATABASE cmdb_production_queue OWNER cmdb;
          CREATE DATABASE cmdb_production_cable OWNER cmdb;
          SQL
          "$tool" restore "$set_name" || stop "docker.sh restore failed"
          contains "a second restore is refused" "holds data" "$("$tool" restore "$set_name" 2>&1 || true)"
          docker run -d --name fleet-cmdb --network fleet-db --cap-drop ALL --security-opt no-new-privileges \
            -v fleet-cmdb_storage:/rails/storage --env-file "$RUNNER_TEMP/restore.env" fleet-cmdb:ci > /dev/null
          rm -f "$RUNNER_TEMP/restore.env"
          for _ in $(seq 1 60); do docker exec fleet-cmdb curl -fsS -o /dev/null http://localhost:3000/up 2>/dev/null && break; sleep 3; done
          expect "the restored app has the host" 1 "$(docker exec fleet-cmdb bin/rails runner 'print Host.where(hostname: "vm-01.example.lan").count')"
          expect "and the operator" 1 "$(docker exec fleet-cmdb bin/rails runner 'print OperatorAllowlistEntry.count')"
          expect "and the release files" ci "$(docker exec fleet-cmdb cat /rails/storage/releases/deploy-ci-marker)"
          systemctl --user start fleet-cmdb-backup.service || stop "the backup after the restore failed"
          wait_backup_ok || failed=1
          echo "/health: $(health)"
          expect "a backup after the restore makes /health report it again" ok "$(health | sed -n 's/.*"backup":"\([a-z]*\)".*/\1/p')"
          expect "two sets now" 2 "$(sudo ls "$backups" | grep -c '^fleet-cmdb-')"
          if [ "$failed" -ne 0 ]; then docker logs --tail 100 fleet-cmdb; exit 1; fi

  gate:
    name: Deploy CI
    needs: [changes, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          CHANGES: ${{ needs.changes.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "changes=$CHANGES image=$IMAGE"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$IMAGE" = "failure" ] || [ "$IMAGE" = "cancelled" ]; then exit 1; fi
