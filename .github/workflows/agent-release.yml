# Agent release (P1-PACKAGING, ADR 0018). Started by the owner from the Actions tab: Agent release > Run
# workflow on main, with the version to release (for example 1.2.0). Builds the static x86_64 musl binary
# with that version compiled in, writes the signed manifest, and creates the tag `agent-v<version>` and the
# GitHub release. No commit is needed: the version comes from the run, not from agent/Cargo.toml, whose
# version is only the development builds' (owner, 2026-11-08). The process, the formats, and the repository
# settings it relies on are in docs/releases.md.
#
#   test     the test suite, in its own job: test code never runs where the release binary is built
#   build    no secrets; refuses a run that is not on main, a version that is not SemVer, already released, or
#            not newer than every earlier release; builds the binary reproducibly with the version compiled in
#            (FLEET_AGENT_VERSION, scripts/build-release.sh) and shows its SHA-256 in the job summary
#   rebuild  builds the same commit again on a separate runner, as an independent witness
#   sign     the only job with the release key: bound to the protected `release` environment, so it
#            waits for the owner's approval; signs only if both builds produced the identical binary,
#            sees only the manifest, runs no repository code, and holds the key in a file only for
#            the one minisign command
#   publish  verifies the signature with the agent's own `verify-release` and with minisign against
#            the current key in the repository, records build provenance for the binary (SLSA, `gh
#            attestation verify`), then creates the tag on the run's commit and the release
#
# Why two builds (review of #72): building runs every dependency's build script. A signature only proves
# the binary came out of our build job; requiring a byte-identical binary from a second, independent
# runner means a tampered build would have to compromise both identically.
#
# There is no other trigger, so other builds (Agent CI) are never signed. The tag is created by this workflow
# only after the owner approved the signature, so an `agent-v*` tag always names a published release. Actions
# are pinned to commit SHAs because one of these jobs holds the release key; Dependabot updates them.
name: Agent release
run-name: Agent release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.2.0 (SemVer; must be newer than every earlier release)"
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: x86_64-unknown-linux-musl # DEC-01

jobs:
  test:
    name: Test ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      # Its own job: nothing it builds or runs reaches the release files.
      - name: cargo test
        run: cargo test --locked

  build:
    name: Build ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.names.outputs.version }}
      binary: ${{ steps.names.outputs.binary }}
      manifest: ${{ steps.names.outputs.manifest }}
      sha256: ${{ steps.release.outputs.sha256 }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the earlier release tags, to check the version is newer

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Check the version
        id: names
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if ! printf '%s\n' "$VERSION" | grep -Eqx "$semver"; then
            echo "::error::version '$VERSION' is not <MAJOR>.<MINOR>.<PATCH>[-<pre-release>], for example 1.2.0"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this workflow on main; releases are made only from main"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/agent-v$VERSION" > /dev/null; then
            echo "::error::agent-v$VERSION is already released; a release is never replaced, so choose a newer version"
            exit 1
          fi
          # Newer than every earlier release, by SemVer precedence (pre-releases sort before their release).
          git tag --list 'agent-v*' | sed 's/^agent-v//' | scripts/check-release-version.py "$VERSION"
          if ! grep -v '^#' release-keys/current.pub | grep -q '^untrusted comment:'; then
            echo "::error::agent/release-keys/current.pub holds no key; see docs/releases.md"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "binary=fleet-agent-$VERSION-$TARGET"
            echo "manifest=fleet-agent-$VERSION-$TARGET.manifest.json"
          } >> "$GITHUB_OUTPUT"

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # No dependency cache: a release is built from a clean state. Tests run in the `test` job.
      - name: Build reproducibly
        id: release
        env:
          FLEET_AGENT_VERSION: ${{ steps.names.outputs.version }} # compiled in as the agent's version (src/main.rs)
        run: |
          set -eu
          bin=$(scripts/build-release.sh "$TARGET")
          echo "sha256=$(sha256sum "$bin" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Check the binary is static and has the release's version
        env:
          VERSION: ${{ steps.names.outputs.version }}
          BIN: target/${{ env.TARGET }}/release/fleet-agent
        run: |
          set -eu
          file "$BIN"
          file "$BIN" | grep -Eq '(statically|static-pie) linked'
          "$BIN" --version
          # `fleet-agent <version> (agent schema <n>)`
          if [ "$("$BIN" --version | cut -d ' ' -f 2)" != "$VERSION" ]; then
            echo "::error::the binary does not report version $VERSION"
            exit 1
          fi

      - name: Write the manifest and checksums
        env:
          VERSION: ${{ steps.names.outputs.version }}
          BINARY: ${{ steps.names.outputs.binary }}
          MANIFEST: ${{ steps.names.outputs.manifest }}
        run: |
          set -eu
          mkdir -p ../dist
          cp "target/$TARGET/release/fleet-agent" "../dist/$BINARY"
          scripts/release-manifest.sh "$VERSION" "$TARGET" "../dist/$BINARY" > "../dist/$MANIFEST"
          cat "../dist/$MANIFEST"
          (cd ../dist && sha256sum "$BINARY" "$MANIFEST" > SHA256SUMS && cat SHA256SUMS)

      - name: Show the approver what will be signed
        # The approval of the `sign` job shows nothing about the artefact; this summary does, and the
        # same SHA-256 must come out of the independent `rebuild` job before anything is signed.
        env:
          VERSION: ${{ steps.names.outputs.version }}
          BINARY: ${{ steps.names.outputs.binary }}
          MANIFEST: ${{ steps.names.outputs.manifest }}
        run: |
          set -eu
          {
            echo "## fleet-agent $VERSION for $TARGET"
            echo
            echo "Commit \`$GITHUB_SHA\`. Approve the \`sign\` job only if this is the release you meant to make."
            echo
            echo '```'
            cat "../dist/SHA256SUMS"
            echo '```'
            echo
            echo "Size: $(stat -c %s "../dist/$BINARY") bytes. Manifest:"
            echo '```json'
            cat "../dist/$MANIFEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the manifest for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manifest
          path: dist/${{ steps.names.outputs.manifest }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  rebuild:
    name: Rebuild ${{ inputs.version }} independently
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.rebuild.outputs.sha256 }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build reproducibly
        id: rebuild
        env:
          FLEET_AGENT_VERSION: ${{ inputs.version }} # as the build job; a different value makes a different binary, and nothing is signed
        run: |
          set -eu
          bin=$(scripts/build-release.sh "$TARGET")
          sha=$(sha256sum "$bin" | cut -d ' ' -f 1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Independent rebuild: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Sign (needs the owner's approval)
    needs: [test, build, rebuild]
    # Belt and braces with the trigger and the build job's check: never sign anything but a run on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - name: Require two identical builds
        env:
          BUILT: ${{ needs.build.outputs.sha256 }}
          REBUILT: ${{ needs.rebuild.outputs.sha256 }}
        run: |
          set -eu
          if [ -z "$BUILT" ] || [ "$BUILT" != "$REBUILT" ]; then
            echo "::error::the build ($BUILT) and the independent rebuild ($REBUILT) differ; nothing is signed"
            exit 1
          fi
          echo "Both builds: $BUILT"

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      - name: Download the manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: dist

      - name: Sign the manifest
        # The secrets reach only this step. The key line is written to a file readable only by this
        # user and removed when the step ends, however it ends; nothing here prints it.
        env:
          SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.AGENT_RELEASE_SIGNING_KEY_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          set -eu
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::the release environment has no AGENT_RELEASE_SIGNING_KEY secret; see docs/releases.md"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf 'untrusted comment: fleet-agent release signing key\n%s\n' "$SIGNING_KEY" > "$key"
          printf '%s\n' "$SIGNING_KEY_PASSWORD" \
            | minisign -S -s "$key" -m "dist/$MANIFEST" -t "fleet-agent $VERSION $TARGET release manifest" > /dev/null
          cat "dist/$MANIFEST.minisig"

      - name: Upload the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signature
          path: dist/${{ needs.build.outputs.manifest }}.minisig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
      id-token: write # build provenance: GitHub's signing identity for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Download the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist

      - name: Verify
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
          BINARY: ${{ needs.build.outputs.binary }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          chmod 0755 "$BINARY"
          # 1. As an agent will: the keys built into this very binary, then size and SHA-256.
          "./$BINARY" verify-release --manifest "$MANIFEST" --signature "$MANIFEST.minisig" --binary "$BINARY"
          # 2. Independently: minisign itself, with the current key from the repository. Releases are
          #    always signed with the current key; the next key is only trusted, never used, until a
          #    rotation makes it current (docs/releases.md).
          grep -v '^#' ../agent/release-keys/current.pub > "$RUNNER_TEMP/current.pub"
          minisign -V -p "$RUNNER_TEMP/current.pub" -m "$MANIFEST"
          # 3. The signed manifest names this release's version and target, and the binary both builds made.
          jq -e --arg v "$VERSION" --arg t "$TARGET" --arg s "$SHA256" \
            '.version == $v and .target == $t and .sha256 == $s' "$MANIFEST"

      - name: Record build provenance
        # SLSA provenance for the binary, signed by GitHub: which workflow run built it from which commit.
        # Operators check it with `gh attestation verify <binary> --repo hostilecity/fleet-cmdb`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.binary }}

      - name: Create the tag and publish the GitHub release
        # The tag agent-v<version> is created here, on the run's commit, only now that the signature is
        # verified; the tag ruleset lets GitHub Actions create it and nothing move or delete it.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: agent-v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
          BINARY: ${{ needs.build.outputs.binary }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          set -eu
          cd dist
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          notes="fleet-agent $VERSION for $TARGET. Check the download with SHA256SUMS; agents verify the manifest signature (minisign, Ed25519) against the release keys built into them before installing (docs/releases.md)."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $prerelease \
            --title "fleet-agent $VERSION" --notes "$notes" \
            "$BINARY" "$MANIFEST" "$MANIFEST.minisig" SHA256SUMS
