# Deploy (P1-O03): builds and runs the server on its VM (docs/operations/install-server.md). On a self-hosted runner
# on the LAN it connects to the VM over SSH, ships the commit's cmdb/, docs/api/, agent/trust/, agent/release-keys/, and ops/backup/ (tar), builds the image there, and replaces the
# fleet-cmdb container, which joins the existing PostgreSQL container's Docker network and publishes port 443: HTTPS
# with the server's Cloudflare Origin CA certificate, for agents and the Cloudflare tunnel (ADR 0024). Settings come
# from the "production" environment; secret values travel only on SSH standard input into a mode-0600 env file for
# `docker run --env-file`, never on a command line.
#
# Runs on every push to main, and when started by hand on main (Actions > Deploy > Run workflow, e.g. after changing
# a setting). It deploys the run's own commit (GITHUB_SHA), so to roll back,
# re-run an earlier Deploy run (it redeploys its commit) or revert on main. The runner needs bash, ssh and tar, not
# git: actions/checkout downloads the commit through the API when git is missing. It also needs openssl, to check
# that agents will trust the server's certificate before it is deployed.
#
# Backups (#138, docs/operations/backup-and-restore.md): before the app is replaced it writes the backup's settings
# (none secret: the backup reads the database password from the app container when it runs) into
# ~/.config/fleet-cmdb/backup.env, and runs ops/backup/install.sh, which checks lingering and installs the deploy
# user's systemd timer for ops/backup/docker.sh (pg_dump in a throwaway postgres container on the database network).
# ops/deploy/deploy.sh then replaces the app under the backup lock: it waits for a running backup and refuses during
# a restore. Last, if the backup location holds no set yet, the first backup starts in the background.
#
# Background jobs run inside the app container (SOLID_QUEUE_IN_PUMA). With the variable FLEET_JOBS_CONTAINER set to
# true they run in a second container instead, fleet-cmdb-jobs, from the same image and settings (#198,
# docs/operations/scaling.md); unset or false goes back to one container.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  deploy:
    name: Deploy to the server
    # Only main is ever deployed: a manual run started from another branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'fleet-cmdb' }}
      DB_NETWORK: ${{ vars.FLEET_DB_NETWORK }}
      JOBS_CONTAINER: ${{ vars.FLEET_JOBS_CONTAINER || 'false' }}
      BACKUP_DIR: ${{ vars.FLEET_BACKUP_DIR || '/var/backups/fleet-cmdb' }}
      BACKUP_ALLOW_LOCAL: ${{ vars.FLEET_BACKUP_ALLOW_LOCAL || 'false' }}
      BACKUP_RETENTION_DAYS: ${{ vars.FLEET_BACKUP_RETENTION_DAYS }}
      BACKUP_PG_IMAGE: ${{ vars.FLEET_BACKUP_PG_IMAGE || 'postgres:17' }}
      BACKUP_DRILL_PGHOST: ${{ vars.FLEET_BACKUP_DRILL_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the deploy settings
        env:
          # Only to warn: settings the app reads as variables are never passed on when they are set as secrets. Each is
          # tested for being set, and no value is printed.
          MISPLACED_RELEASE_KEY_CURRENT: ${{ secrets.FLEET_RELEASE_KEY_CURRENT }}
          MISPLACED_RELEASE_KEY_NEXT: ${{ secrets.FLEET_RELEASE_KEY_NEXT }}
          MISPLACED_DASHBOARD_HOST: ${{ secrets.FLEET_DASHBOARD_HOST }}
          MISPLACED_AGENT_HOST: ${{ secrets.FLEET_AGENT_HOST }}
        run: |
          for name in RELEASE_KEY_CURRENT RELEASE_KEY_NEXT DASHBOARD_HOST AGENT_HOST; do
            misplaced="MISPLACED_$name"
            [ -z "${!misplaced}" ] || echo "::warning::FLEET_$name is set as a secret, which the deploy does not read: set it as a variable of the production environment instead"
          done
          echo "DEPLOY_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Deploying $GITHUB_SHA"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] || { echo "::error::set the variable DEPLOY_HOST"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::set the variable DEPLOY_USER"; exit 1; }
          [[ "$DEPLOY_DIR" =~ ^[A-Za-z0-9._/-]+$ && "$DEPLOY_DIR" != *..* ]] || { echo "::error::DEPLOY_DIR is not a plain path"; exit 1; }
          [[ "$DB_NETWORK" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::set the variable FLEET_DB_NETWORK"; exit 1; }
          [[ "$JOBS_CONTAINER" =~ ^(true|false)$ ]] || { echo "::error::FLEET_JOBS_CONTAINER must be true, false, or unset"; exit 1; }
          [[ "$BACKUP_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$BACKUP_DIR" != *..* ]] || { echo "::error::FLEET_BACKUP_DIR must be an absolute plain path"; exit 1; }
          [[ "$BACKUP_ALLOW_LOCAL" =~ ^(true|false)$ ]] || { echo "::error::FLEET_BACKUP_ALLOW_LOCAL must be true, false, or unset"; exit 1; }
          [[ "$BACKUP_RETENTION_DAYS" =~ ^([1-9][0-9]*)?$ ]] || { echo "::error::FLEET_BACKUP_RETENTION_DAYS must be a whole number of days, or unset"; exit 1; }
          [[ "$BACKUP_PG_IMAGE" =~ ^[a-z0-9][a-z0-9._/:@-]*$ ]] || { echo "::error::FLEET_BACKUP_PG_IMAGE is not an image name"; exit 1; }
          [[ "$BACKUP_DRILL_PGHOST" =~ ^([A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || { echo "::error::FLEET_BACKUP_DRILL_HOST is not a host name"; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          # In this job's temporary directory, removed at the end; never in the runner user's ~/.ssh.
          dir="$RUNNER_TEMP/deploy-ssh"
          rm -rf "$dir" && (umask 077 && mkdir "$dir" && printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key")
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          else ssh-keyscan -H -T 10 "$DEPLOY_HOST" > "$dir/known_hosts" 2>/dev/null; fi
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile %s/key\n  IdentitiesOnly yes\n  UserKnownHostsFile %s/known_hosts\n  StrictHostKeyChecking yes\n  BatchMode yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$dir" "$dir" > "$dir/config"
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"

      - name: Check that agents will trust the certificate
        env:
          FLEET_TLS_CERT: ${{ secrets.FLEET_TLS_CERT }}
        run: |
          # Agents trust the system store plus the roots compiled in from agent/trust (ADR 0024). A certificate they do not
          # trust would cut every agent off, including from the update that could fix it, so it stops the deploy here.
          # The key matching the certificate, and the certificate covering FLEET_AGENT_HOST, are checked when the app boots.
          [ -n "$FLEET_TLS_CERT" ] || { echo "::error::set FLEET_TLS_CERT in the production environment (the Origin CA certificate, PEM)"; exit 1; }
          cat agent/trust/*.pem > "$RUNNER_TEMP/agent-roots.pem"
          printf '%s\n' "$FLEET_TLS_CERT" > "$RUNNER_TEMP/server-cert.pem"
          if ! openssl verify -purpose sslserver -CAfile "$RUNNER_TEMP/agent-roots.pem" -untrusted "$RUNNER_TEMP/server-cert.pem" "$RUNNER_TEMP/server-cert.pem"; then
            echo "::error::FLEET_TLS_CERT is not signed by a certificate authority agents trust (agent/trust, or the system store)"; exit 1
          fi
          openssl x509 -in "$RUNNER_TEMP/server-cert.pem" -noout -subject -ext subjectAltName -enddate
          rm -f "$RUNNER_TEMP/agent-roots.pem" "$RUNNER_TEMP/server-cert.pem"

      - name: Ship the code
        run: |
          tar -cf - cmdb docs/api agent/trust agent/release-keys ops/backup ops/deploy | ssh -F "$SSH_CONFIG" server \
            "rm -rf '$DEPLOY_DIR/build-$DEPLOY_SHA' && mkdir -p '$DEPLOY_DIR/build-$DEPLOY_SHA' && tar -xf - -C '$DEPLOY_DIR/build-$DEPLOY_SHA'"

      - name: Write the app's env file on the server
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          FLEET_ENCRYPTION_KEY: ${{ secrets.FLEET_ENCRYPTION_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FLEET_TLS_CERT: ${{ secrets.FLEET_TLS_CERT }}
          FLEET_TLS_KEY: ${{ secrets.FLEET_TLS_KEY }}
          FLEET_ADVISORY_FEED_TOKEN: ${{ secrets.FLEET_ADVISORY_FEED_TOKEN }}
          FLEET_DASHBOARD_HOST: ${{ vars.FLEET_DASHBOARD_HOST }}
          FLEET_AGENT_HOST: ${{ vars.FLEET_AGENT_HOST }}
          FLEET_RELEASE_KEY_CURRENT: ${{ vars.FLEET_RELEASE_KEY_CURRENT }}
          FLEET_RELEASE_KEY_NEXT: ${{ vars.FLEET_RELEASE_KEY_NEXT }}
          RAILS_LOG_LEVEL: ${{ vars.RAILS_LOG_LEVEL }}
          PGHOST: ${{ vars.FLEET_DB_HOST || 'postgres' }}
          FLEET_EXTRA_SETTINGS: ${{ vars.FLEET_EXTRA_SETTINGS }}
        run: |
          # One NAME=value per line (docker takes the value literally). Unset optional settings are left out, so the
          # app's defaults apply. Only names are ever printed.
          lines=()
          # Jobs in the app container, unless they have their own (FLEET_JOBS_CONTAINER).
          if [ "$JOBS_CONTAINER" != true ]; then lines+=(SOLID_QUEUE_IN_PUMA=1); fi
          for name in SECRET_KEY_BASE FLEET_ENCRYPTION_KEY DATABASE_PASSWORD GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET FLEET_DASHBOARD_HOST FLEET_AGENT_HOST \
                      PGHOST RAILS_LOG_LEVEL FLEET_RELEASE_KEY_CURRENT FLEET_RELEASE_KEY_NEXT FLEET_ADVISORY_FEED_TOKEN; do
            [[ "${!name}" != *$'\n'* ]] || { echo "::error::$name holds a line break"; exit 1; }
            if [ -n "${!name}" ]; then lines+=("$name=${!name}"); fi
          done
          for name in SECRET_KEY_BASE FLEET_ENCRYPTION_KEY DATABASE_PASSWORD GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            [ -n "${!name}" ] || { echo "::error::set the secret $name in the production environment"; exit 1; }
          done
          for name in FLEET_DASHBOARD_HOST FLEET_AGENT_HOST; do
            [ -n "${!name}" ] || { echo "::error::set the variable $name in the production environment"; exit 1; }
          done
          # The certificate and key are PEM files with line breaks; docker takes one line per value, so they are base64.
          for name in FLEET_TLS_CERT FLEET_TLS_KEY; do
            [ -n "${!name}" ] || { echo "::error::set $name in the production environment"; exit 1; }
            lines+=("${name}_BASE64=$(printf '%s\n' "${!name}" | base64 -w0)")
          done
          while IFS= read -r line; do # FLEET_EXTRA_SETTINGS: further non-secret settings, NAME=value per line
            [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue
            [[ "$line" =~ ^[A-Z][A-Z0-9_]*= ]] || { echo "::error::FLEET_EXTRA_SETTINGS: a line is not NAME=value"; exit 1; }
            lines+=("$line")
          done <<< "$FLEET_EXTRA_SETTINGS"
          printf '%s\n' "${lines[@]}" | ssh -F "$SSH_CONFIG" server "umask 077 && cat > '$DEPLOY_DIR/fleet-cmdb.env'"

      - name: Set up backups on the server
        # Before the app is replaced, so a missing one-time step (lingering) stops the deploy with the old app running.
        run: |
          # No secret here: the backup reads the database host and password from the app container when it runs.
          lines=("FLEET_DB_NETWORK=$DB_NETWORK" "BACKUP_DIR=$BACKUP_DIR" "BACKUP_PG_IMAGE=$BACKUP_PG_IMAGE")
          if [ "$BACKUP_ALLOW_LOCAL" = true ]; then lines+=(BACKUP_ALLOW_LOCAL=true); fi
          if [ -n "$BACKUP_RETENTION_DAYS" ]; then lines+=("BACKUP_RETENTION_DAYS=$BACKUP_RETENTION_DAYS"); fi
          if [ -n "$BACKUP_DRILL_PGHOST" ]; then lines+=("BACKUP_DRILL_PGHOST=$BACKUP_DRILL_PGHOST"); fi
          # chmod: umask applies only to a new file, and an older deploy may have left one with another mode.
          printf '%s\n' "${lines[@]}" | ssh -F "$SSH_CONFIG" server \
            'umask 077 && mkdir -p "$HOME/.config/fleet-cmdb" && cat > "$HOME/.config/fleet-cmdb/backup.env" && chmod 0600 "$HOME/.config/fleet-cmdb/backup.env"'
          echo "==> install the backup timer"
          ssh -F "$SSH_CONFIG" server "bash '$DEPLOY_DIR/build-$DEPLOY_SHA/ops/backup/install.sh'"

      - name: Build and run on the server
        # ops/deploy/deploy.sh: under the backup lock, waits for a running backup and refuses during a restore.
        run: |
          ssh -F "$SSH_CONFIG" server "bash '$DEPLOY_DIR/build-$DEPLOY_SHA/ops/deploy/deploy.sh' '$DEPLOY_DIR' '$DEPLOY_SHA' '$DB_NETWORK' '$JOBS_CONTAINER'"

      - name: Take the first backup
        run: |
          # Only when the backup location holds no set at all, in the background (a big database must not hold the
          # deploy). Never after a rebuild with empty databases: the good sets are there, and the next backup refuses
          # a database with fewer hosts or audit entries than the newest set (backup-and-restore.md).
          ssh -F "$SSH_CONFIG" server 'bash "$HOME/.local/share/fleet-cmdb/backup/docker.sh" first-backup' \
            || echo "::warning::the first backup could not start (above), so /health stays 503: see docs/operations/backup-and-restore.md"

      - name: Clean up
        if: always()
        run: |
          if [ -n "${SSH_CONFIG:-}" ]; then
            ssh -F "$SSH_CONFIG" server "rm -rf '$DEPLOY_DIR/build-${DEPLOY_SHA:-none}' '$DEPLOY_DIR/fleet-cmdb.env' '$DEPLOY_DIR/fleet-cmdb-jobs.env'" || true
          fi
          rm -rf "$RUNNER_TEMP/deploy-ssh"
