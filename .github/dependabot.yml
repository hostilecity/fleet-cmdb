# Dependency update pull requests (P0-SERVER-CI, P0-AGENT).
version: 2
updates:
  - package-ecosystem: bundler
    directory: /cmdb
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rails:
        patterns: ["rails", "action*", "active*", "railties"]

  - package-ecosystem: cargo
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
