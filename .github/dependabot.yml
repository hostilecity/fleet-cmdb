# Dependency update pull requests (P0-SERVER-CI). The agent's cargo entry is added by P0-AGENT.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /cmdb
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rails:
        patterns: ["rails", "action*", "active*", "railties"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
