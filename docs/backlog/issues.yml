- key: P1-DASH-ACTIONS
  title: "Dashboard: onboarding approval, pre-registration, and host actions"
  milestone: 1
  labels: ["area:dashboard", "area:server", "security"]
  covers: [FR-1.5, FR-S.1, FR-S.3, FR-S.4, FR-1.1, AC-1.5, AC-1.8]
