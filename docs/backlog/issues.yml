- key: P1-AGENT-CORE
  title: "Agent config and HTTP client"
  milestone: 1
  labels: ["area:agent", "security"]
  covers: [FR-1.6, FR-S.1, NFR-1, NFR-4, FR-1.2, FR-S.2, NFR-5, AC-1.1, AC-1.5]
  goal: "The agent loads validated config and talks to the server over verified HTTPS with retry and backoff, never crashing on server outages."
  done:
    - "An `http://` URL is rejected, there is no way to skip certificate verification, and the credential never appears in logs."
