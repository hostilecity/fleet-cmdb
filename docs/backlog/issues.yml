# GitHub issues generated by `import.rb`. One entry per issue; keep it short.
# Implementation details live in `specs/<key lowercased>.md` and are the source of truth.
# Fields: key, title, milestone (index in config.yml), labels, covers (requirement IDs), goal (one sentence),
#         done (2 or 3 acceptance criteria), blocked_by (other issue keys).

- key: P0-AGENT
  title: "Bootstrap the Rust agent crate and its CI"
  milestone: 0
  labels: ["area:agent", "area:ops"]
  covers: [FR-1.6, NFR-4]
  goal: "A `fleet-agent` crate in `agent/` builds a static x86_64 musl binary and is checked by CI on every pull request."
  done:
    - "`cargo build --release --target x86_64-unknown-linux-musl` produces a statically linked binary and `fleet-agent --version` works."
    - "`cargo fmt --check`, `cargo clippy -- -D warnings`, `cargo test`, and a dependency audit run in GitHub Actions on pull requests touching `agent/`."
  blocked_by: []

- key: P0-SERVER-CI
  title: "CI for the Rails server"
  milestone: 0
  labels: ["area:server", "area:ops"]
  covers: [NFR-4]
  goal: "Every pull request touching `cmdb/` runs the server checks in GitHub Actions."
  done:
    - "A PR touching `cmdb/` runs rubocop, brakeman, bundler-audit, and RSpec against PostgreSQL and reports status."
    - "A deliberately failing spec fails the check, and branch protection on `main` requires it once it is green."
  blocked_by: []

- key: P0-CONTRACT
  title: "API contract workspace (docs/api)"
  milestone: 0
  labels: ["area:api", "area:ops"]
  covers: [FR-S.2, NFR-5]
  goal: "`docs/api/` holds the agent API conventions, JSON Schemas, and example payloads that both the server and agent tests consume."
  done:
    - "Server and agent test suites read schemas and examples from `docs/api/` rather than keeping their own copies."
    - "Adding a schema field without a matching example fails a test, and examples contain no real hostnames or credentials."
  blocked_by: []

- key: P1-HOSTS
  title: "Host records, enrollment states, and audit log"
  milestone: 1
  labels: ["area:server"]
  covers: [FR-1.1, AC-1.7, FR-S.3, NFR-1]
  goal: "Hosts exist as records with the FR-1.1 enrollment state machine, and every operator-visible change is written to an append-only audit log."
  done:
    - "Every transition in the FR-1.1 table has a passing spec, every other transition is rejected, and retired hosts leave the active scope."
    - "No code path updates or deletes an audit entry, and each entry is written in the same transaction as the change it records."
  blocked_by: []

- key: P1-ACCESS
  title: "Operator sign-in and host-based route separation"
  milestone: 1
  labels: ["area:server", "area:dashboard", "security"]
  covers: [FR-S.4, NFR-1, AC-1.7, FR-S.2]
  goal: "Only allowlisted, verified Google accounts can use the dashboard, and `/api/v1` is served only on the private agent hostname."
  done:
    - "A route-enumeration spec shows anonymous or non-allowlisted users reach no dashboard route."
    - "`/api/v1` returns 404 on the dashboard hostname and dashboard routes return 404 on the agent hostname, including with spoofed Host headers."
  blocked_by: [P1-API-AUTH]

- key: P1-API-AUTH
  title: "Agent API foundation, credentials, and enrollment"
  milestone: 1
  labels: ["area:server", "area:api", "security"]
  covers: [FR-S.2, NFR-5, NFR-1, FR-S.1, AC-1.5, AC-1.6, FR-1.1, AC-1.1, AC-1.7]
  goal: "An agent can redeem a one-time token for a per-host credential and call a versioned, validated, rate-limited JSON API that exposes only its own host."
  done:
    - "A token is redeemable exactly once, and after re-enrollment or revocation the old credential gets 401 immediately (AC-1.5)."
    - "A credential for host A cannot read or modify host B on any endpoint (AC-1.6)."
    - "Every error path returns the documented envelope, and a failed request leaves no partial records."
  blocked_by: [P0-CONTRACT, P1-HOSTS]

- key: P1-HEARTBEAT
  title: "Heartbeat endpoint and liveness evaluation"
  milestone: 1
  labels: ["area:server"]
  covers: [FR-1.2, FR-1.4, AC-1.1, AC-1.2, AC-1.7, NFR-3]
  goal: "Heartbeats update last-seen on the server, and a recurring job derives online, stale, and offline status from it with recorded transitions."
  done:
    - "Stopping heartbeats moves a host online, stale, then offline at the configured thresholds, and resuming returns it to online (AC-1.2)."
    - "Agent-reported time never affects liveness, and heartbeat p95 stays under 200 ms with 50 hosts."
  blocked_by: [P1-API-AUTH, P1-HOSTS]

- key: P1-INVENTORY
  title: "Inventory report endpoint with snapshots"
  milestone: 1
  labels: ["area:server", "area:api"]
  covers: [FR-1.3, FR-S.1, FR-S.2, AC-1.3, AC-1.4, AC-1.7]
  goal: "The server accepts inventory reports idempotently, keeps the current inventory, and snapshots only when stable fields change."
  done:
    - "Sending the same report twice creates one snapshot, and a volatile-only change creates none (AC-1.4)."
    - "Null fields with collection warnings are accepted, and invalid or oversize reports are rejected with no partial write."
  blocked_by: [P1-API-AUTH]

- key: P1-OPERABILITY
  title: "Retention, health, logging, job failures, and security hardening"
  milestone: 1
  labels: ["area:server", "area:ops", "security"]
  covers: [NFR-2, NFR-3, FR-S.3, NFR-4, NFR-1, AC-1.7]
  goal: "The server prunes old data, exposes a health endpoint with traceable logs, surfaces failed jobs, and is hardened against hostile agent data."
  done:
    - "Hostile strings in every agent- and operator-supplied field render escaped in every view under a restrictive CSP."
    - "Retention prunes expired snapshots but keeps each host's newest and never touches audit entries, and failed jobs appear in an operator-visible list and in `/health`."
  blocked_by: [P1-INVENTORY, P1-HEARTBEAT, P1-ACCESS, P1-DASH-FLEET, P1-DASH-ACTIONS, P1-ONBOARD, P1-UPDATES]

