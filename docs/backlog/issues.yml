- key: P1-AUDIT-PAGE
  title: "Dashboard: read-only fleet-wide audit log page"
  milestone: 1
  labels: ["area:dashboard", "area:server"]
  covers: [FR-S.3, FR-S.4, NFR-1]
  goal: "Signed-in operators can browse and filter the whole audit log read-only, split out of P1-HOSTS because it needs operator sign-in first."
  done:
    - "A signed-in operator sees entries newest first, filterable by actor, action, target, and date range, with pagination."
