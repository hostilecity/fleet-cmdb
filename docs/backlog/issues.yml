  goal: "Agents poll for tasks and report progress and results through endpoints that claim atomically and are idempotent."
  done:
    - "Parallel polls claim a task exactly once, and an expired task is never delivered (AC-3.8)."
    - "Duplicate results are accepted, conflicting ones rejected, output is truncated and sanitised, and a host cannot see another host's tasks."
  blocked_by: [P3-TASK-MODEL, P1-API-AUTH]

- key: P3-TASK-CONTROLS
  title: "Leases, expiry, timeouts, cancellation, allowlists, and task audit"
  milestone: 3
  labels: ["area:server", "risk:high"]
  covers: [FR-3.2, AC-3.5, AC-3.6, AC-3.8, AC-3.7, FR-3.1, FR-S.3, AC-3.9, FR-3.4, NFR-2]
  goal: "The server enforces leases, expiry, timeouts, cancellation semantics, allowlists, and a complete audit trail for tasks."
  done:
    - "The recurring jobs move tasks to the right states, and cancelling a queued task means it is never delivered (AC-3.5, AC-3.6)."
    - "The restart allowlist is empty by default and rechecked at claim time, and every task transition and allowlist change produces an audit entry."
  blocked_by: [P3-TASK-API, P3-TASK-MODEL]

- key: P3-DASH-CREATE
  title: "Dashboard: create-task flow with second factor"
  milestone: 3
  labels: ["area:dashboard", "area:server", "security", "risk:high"]
  covers: [FR-3.4, FR-3.1, FR-S.4, AC-3.1, NFR-1]
  goal: "Operators create tasks through a guided flow that shows exactly what will run and requires a passkey or TOTP."
  done:
    - "There is no free-text field sent as a command, and batches above 3 hosts require typing the host count, capped at 25."
    - "Creating or cancelling a task or changing an allowlist is rejected without a recent second factor, including through forged POSTs."
  blocked_by: [P3-TASK-MODEL, P3-TASK-CONTROLS, P1-ACCESS]

- key: P3-DASH-TASKS
  title: "Dashboard: task list, detail, batch progress, and cancel"
  milestone: 3
  labels: ["area:dashboard"]
  covers: [FR-3.4, FR-3.2, AC-3.6]
  goal: "Operators can list, inspect, and cancel tasks and watch fleet-wide batch progress."
  done:
    - "Batch counts match task states and update without a reload."
    - "Output containing markup renders as text, and cancel explains what it can and cannot do for a running task."
  blocked_by: [P3-DASH-CREATE, P3-TASK-API, P3-TASK-CONTROLS]

- key: P3-AGENT-LEDGER
  title: "Agent task config, capabilities, poller, and durable ledger"
  milestone: 3
  labels: ["area:agent", "security", "risk:high"]
  covers: [FR-3.1, FR-3.3, AC-3.9, FR-3.2, AC-3.3]
  goal: "The agent holds local task configuration, advertises its capabilities, and polls with a durable ledger so a task never runs twice."
  done:
    - "Risky task types are disabled by default, and the compiled-in catalog matches the shared file."
    - "Killing the agent after the `started` record is written reports `interrupted` on restart and never re-runs the task (AC-3.3)."
  blocked_by: [P3-TASK-MODEL, P1-AGENT-CORE, P3-TASK-API]

- key: P3-AGENT-EXEC
  title: "Agent task executor and privilege model"
  milestone: 3
  labels: ["area:agent", "security", "risk:high"]
  covers: [FR-3.1, FR-3.3, AC-3.1, AC-3.5, AC-3.7, FR-1.6]
  goal: "A task executor validates strictly, refuses unknown work, and runs fixed argument vectors in a clean environment with timeouts and the least privilege each task needs."
  done:
    - "Unknown types and invalid parameters are refused with nothing executed, proven by a canary (AC-3.1)."
    - "A task over its timeout is killed with its children and reported timed out, and CI fails if a shell invocation appears in the task code (AC-3.5)."
  blocked_by: [P3-AGENT-LEDGER]

- key: P3-AGENT-TASKS
  title: "Agent tasks: refresh_reports and restart_service"
  milestone: 3
  labels: ["area:agent", "security", "risk:high"]
  covers: [FR-3.1, FR-2.1, FR-3.3, AC-3.1, AC-3.9]
  goal: "The agent implements `refresh_reports` and `restart_service` with local allowlists."
  done:
    - "`refresh_reports` produces fresh reports at the server without duplicate snapshots."
    - "A service on the server allowlist but missing from the local one, and the agent's own unit, are refused (AC-3.9)."
  blocked_by: [P3-AGENT-EXEC, P2-AGENT-FACTS, P2-AGENT-PACKAGES]

- key: P3-AGENT-UPDATES
  title: "Agent task: apply_package_updates"
  milestone: 3
  labels: ["area:agent", "security", "risk:high"]
  covers: [FR-3.1, FR-3.3, AC-3.4, AC-3.5]
  goal: "The agent applies Debian package updates under the ADR 0016 policy without ever rebooting."
  done:
    - "On a test VM the task updates packages, reports success with output, and the next package report shows the new versions (AC-3.4)."
    - "`reboot_required` is reported, lock contention fails clearly, and a forced timeout terminates the process tree on a disposable VM."
  blocked_by: [P3-AGENT-EXEC]

