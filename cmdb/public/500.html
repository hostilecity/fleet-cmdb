<!doctype html>
<html lang="en">
  <head>
    <title>Server error · Fleet CMDB</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <!-- Served by ActionDispatch::PublicExceptions, without the app's layout or assets, so the style is inline.
         The approved mockup is docs/mockups/phase-1/states.html. -->
    <style>
    :root { --panel: #eef1ee; --sheet: #f9faf8; --ink: #1d2a2e; --ink-soft: #55625f; --rule: #c7d0cb; --petrol: #1f5f73; --focus: #f2b632; --error-bg: #fbeceb; --lamp-offline: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--panel); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { background: var(--ink); color: #fff; padding: 0.75rem 1.5rem; }
    header a { color: #fff; font-weight: 700; text-decoration: none; }
    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 1rem; }
    .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 1.25rem; }
    .sheet.error { background: var(--error-bg); border-left: 4px solid var(--lamp-offline); }
    p { max-width: 70ch; margin: 0 0 0.75rem; }
    p:last-child { margin-bottom: 0; }
    a { color: var(--petrol); text-underline-offset: 2px; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header><a href="/">Fleet CMDB</a></header>
    <main>
      <h1>Server error</h1>
      <div class="sheet error">
        <p><strong>The server could not complete that request.</strong></p>
        <p>Part of it may have been done. Go back and check before you try again. If it keeps happening, check the server log: <code>docker logs --since 1h fleet-cmdb</code>.</p>
      </div>
    </main>
  </body>
</html>
