  - { key: "service:ufw.service", type: service_state, since: 1 }
  - { key: "service:unattended-upgrades.service", type: service_state, since: 1 }
  - { key: "service:vsftpd.service", type: service_state, since: 1 }
  - { key: "services.enabled", type: string_list, since: 1, max_items: 1000, item_max_length: 256 }
  - { key: "services.running", type: string_list, since: 1, max_items: 1000, item_max_length: 256 }
  - { key: "sshd.allowtcpforwarding", type: string, since: 1, max_length: 16 }
  - { key: "sshd.banner", type: string, since: 1, max_length: 256 }
  - { key: "sshd.ciphers", type: string_list, since: 1, max_items: 64, item_max_length: 256 }
  - { key: "sshd.clientalivecountmax", type: integer, since: 1, minimum: 0, maximum: 1000 }
  - { key: "sshd.clientaliveinterval", type: integer, since: 1, minimum: 0, maximum: 86400 }
  - { key: "sshd.hostbasedauthentication", type: boolean, since: 1 }
  - { key: "sshd.ignorerhosts", type: boolean, since: 1 }
  - { key: "sshd.kexalgorithms", type: string_list, since: 1, max_items: 64, item_max_length: 256 }
  - { key: "sshd.logingracetime", type: integer, since: 1, minimum: 0, maximum: 86400 }
  - { key: "sshd.loglevel", type: string, since: 1, max_length: 16 }
  - { key: "sshd.macs", type: string_list, since: 1, max_items: 64, item_max_length: 256 }
  - { key: "sshd.maxauthtries", type: integer, since: 1, minimum: 0, maximum: 1000 }
  - { key: "sshd.maxsessions", type: integer, since: 1, minimum: 0, maximum: 1000 }
  - { key: "sshd.passwordauthentication", type: boolean, since: 1 }
