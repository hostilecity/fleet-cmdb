# Suggested compensating controls (VT-BUCKETS #259, VT-S05; epic decision 24): a short text per kind of Needs
# attention finding, in our own words. Advice only: nothing here changes a bucket, and an operator records a control
# themselves (VT-OVERRIDES). Checked when the server starts (VulnerabilityTriage::Controls.load). The host tab
# (VT-HOST-TAB) shows the texts for the kinds present.
#
# Each kind names the rules it is shown for and, for N4, the attack vector it describes.
known_exploited:
  rules: [N1]
  text: >-
    Attackers are using this flaw. Until the package can be replaced or fixed, limit who can reach it: stop or disable
    the service if nothing needs it, restrict it to the hosts that must use it with a firewall rule, and watch its logs.
likely_exploited:
  rules: [N2]
  text: >-
    Exploitation is likely soon. Restrict network access to the package's service to the hosts that need it, or stop it
    if nothing does, and check again when Debian publishes a fix.
unsupported:
  rules: [N3]
  text: >-
    Debian no longer fixes this package in this release. Plan to remove or replace it; meanwhile keep it off untrusted
    networks and away from untrusted input.
network_service:
  rules: [N4]
  vector: network
  text: >-
    Reachable over the network without a login. Bind the service to localhost or a private interface, allow only the
    hosts that need it in the firewall, or put an authenticating proxy in front of it.
crafted_file:
  rules: [L3]
  vector: user_action
  text: >-
    Needs a user to open something crafted. Avoid opening untrusted files or links with this package on this host.
local_privilege:
  rules: [L2]
  vector: local
  text: >-
    Needs an attacker who already runs code on this host. Keep logins to the people who need them and remove unused
    accounts.
