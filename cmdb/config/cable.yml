# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  # The listener retries a lost connection after these pauses (seconds), then stops for good; Solid Cable's default
  # is one immediate retry, which a PostgreSQL restart outlasts (review of #218). With the 2 s connect timeout
  # (database.yml) this rides out about 28 s without the database. A poll that succeeds starts the count again.
  reconnect_attempts: [ 0, 1, 2, 5, 10 ]

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  # The listener retries a lost connection after these pauses (seconds), then stops for good; Solid Cable's default
  # is one immediate retry, which a PostgreSQL restart outlasts (review of #218). With the 2 s connect timeout
  # (database.yml) this rides out about 28 s without the database. A poll that succeeds starts the count again.
  reconnect_attempts: [ 0, 1, 2, 5, 10 ]
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
