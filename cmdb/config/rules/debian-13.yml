  # Services that should run

  - key: cron-running
    reference: "CIS Debian Linux 13 v1.0.0 2.4.1.1"
    title: "The cron daemon is enabled and running"
    severity: low
    applies_to: [{ distribution: debian, versions: ["13"] }]
    fact: "service:cron.service"
    condition: { all: [{ field: "active", eq: "active" }, { field: "enabled", eq: "enabled" }] }
    remediation: "Run systemctl enable --now cron."

  - key: auditd-running
    reference: "CIS Debian Linux 13 v1.0.0 6.2.1.2"
    title: "The audit daemon is enabled and running"
    severity: medium
    applies_to: [{ distribution: debian, versions: ["13"] }]
    fact: "service:auditd.service"
    condition: { all: [{ field: "active", eq: "active" }, { field: "enabled", eq: "enabled" }] }
    remediation: "Install auditd and run systemctl enable --now auditd."

  - key: apparmor-running
    reference: "CIS Debian Linux 13 v1.0.0 1.3.1"
    title: "AppArmor is enabled"
    severity: medium
    applies_to: [{ distribution: debian, versions: ["13"] }]
    fact: "service:apparmor.service"
    condition: { all: [{ field: "active", eq: "active" }, { field: "enabled", eq: "enabled" }] }
    remediation: "Run systemctl enable --now apparmor, and check that the kernel was not booted with apparmor=0."

  - key: journald-running
    reference: "CIS Debian Linux 13 v1.0.0 6.1.1.1"
    title: "The systemd journal is running"
    severity: medium
    applies_to: [{ distribution: debian, versions: ["13"] }]
    fact: "service:systemd-journald.service"
    condition: { field: "active", eq: "active" }
    remediation: "Run systemctl start systemd-journald and find out why it stopped (journalctl -b)."


  # Services that should not be in use

  - key: avahi-not-in-use
    reference: "CIS Debian Linux 13 v1.0.0 2.1.2"
    title: "Avahi (mDNS) is not running"
    severity: medium
    applies_to: [{ distribution: debian, versions: ["13"] }]
    fact: "service:avahi-daemon.service"
    condition: { any: [{ absent: true }, { all: [{ field: "active", ne: "active" }, { field: "enabled", not_in: ["enabled", "enabled-runtime"] }] }] }
    remediation: "Run apt purge avahi-daemon, or systemctl disable --now avahi-daemon.service avahi-daemon.socket if something depends on it."

