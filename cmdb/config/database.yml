# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # The most connections one process may open to each database: the largest thread count of any process (Puma's
  # RAILS_MAX_THREADS, the job workers' JOB_THREADS and JOB_REALTIME_THREADS) plus 2 for Solid Queue's polling and
  # heartbeat (lib/sizing/process_sizing.rb). 5 with the defaults. The connection budget against PostgreSQL's
  # max_connections is in docs/operations/scaling.md.
  max_connections: <%= ProcessSizing.database_pool %>
  <%# Optional scale settings (#198, lib/sizing/deployment_topology.rb); a bad value stops the boot here. %>
  <% DeploymentTopology.validate! %>
  <% if DeploymentTopology.transaction_pooler? %>
  # Behind a transaction-mode pooler (FLEET_DB_POOLER=transaction) each transaction may get another server connection:
  # a prepared statement belongs to one server connection, and so does the session-level advisory lock Rails takes
  # around migrations. With it off, run migrations from one process only (FLEET_DB_PREPARE, scaling.md).
  prepared_statements: false
  advisory_locks: false
  <% end %>


# Development mirrors production's layout: the Solid components live in their own databases.
development:
  primary: &primary_development
    <<: *default
    database: cmdb_development
  cache:
    <<: *primary_development
    database: cmdb_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_development
    database: cmdb_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_development
    database: cmdb_development_cable
    migrations_paths: db/cable_migrate
    # An unreachable cable database fails a connection attempt within 2 s (#194), which Solid Cable's listener retries.
    # No statement_timeout: a cancelled poll (ActiveRecord::QueryCanceled) is not an error the listener retries, so
    # it would stop the listener thread for good (review of #218). /health's live_updates check reports that.
    connect_timeout: 2
<% if DeploymentTopology.direct? %>
  # The primary without the pooler (DIRECT_DATABASE_URL, merged over this entry): the session-level advisory locks
  # (SessionLock). Never migrated on its own; prepared statements and advisory locks stay on.
  direct:
    <<: *primary_development
    database_tasks: false
    prepared_statements: true
    advisory_locks: true
<% end %>
<% if DeploymentTopology.replica? %>
  # A streaming replica of the primary (REPLICA_DATABASE_URL, merged over this entry), read only by the pages in
  # ReplicaReads once it has caught up. A replica is never migrated.
  replica:
    <<: *primary_development
    replica: true
    connect_timeout: <%= DeploymentTopology.replica_connect_timeout_seconds %>
<% end %>


  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: cmdb

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary: &primary_test
    <<: *default
    database: cmdb_test
  # Solid Queue's tables, so specs can run real jobs and read real failures (P1-O02). Cache and cable are
  # not needed in tests (null cache, test cable adapter).
  queue:
    <<: *primary_test
    database: cmdb_test_queue
    migrations_paths: db/queue_migrate
  # Always present in tests, on the test database itself, so every page ReplicaReads lists runs on the reading role
  # with writes refused (the transactional fixtures share the writing connection with it).
  replica:
    <<: *primary_test
    replica: true
<% if ENV["DATABASE_URL"] && !ENV["REPLICA_DATABASE_URL"] %>
    url: <%= ENV["DATABASE_URL"] %>
<% end %>

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  primary: &primary_production
    <<: *default
    database: cmdb_production
    username: cmdb
    password: <%= ENV["DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: cmdb_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: cmdb_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: cmdb_production_cable
    migrations_paths: db/cable_migrate
    # An unreachable cable database fails a connection attempt within 2 s (#194), which Solid Cable's listener retries.
    # No statement_timeout: a cancelled poll (ActiveRecord::QueryCanceled) is not an error the listener retries, so
    # it would stop the listener thread for good (review of #218). /health's live_updates check reports that.
    connect_timeout: 2
<% if DeploymentTopology.direct? %>
  # The primary without the pooler (DIRECT_DATABASE_URL, merged over this entry): the session-level advisory locks
  # (SessionLock). Never migrated on its own; prepared statements and advisory locks stay on.
  direct:
    <<: *primary_production
    database_tasks: false
    prepared_statements: true
    advisory_locks: true
<% end %>
<% if DeploymentTopology.replica? %>
  # A streaming replica of the primary (REPLICA_DATABASE_URL, merged over this entry), read only by the pages in
  # ReplicaReads once it has caught up. A replica is never migrated.
  replica:
    <<: *primary_production
    replica: true
    connect_timeout: <%= DeploymentTopology.replica_connect_timeout_seconds %>
<% end %>
