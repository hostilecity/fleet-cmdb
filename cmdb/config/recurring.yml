# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Recurring jobs run by Solid Queue's scheduler. Later issues add their jobs here
# (for example the liveness evaluation job, one entry per environment that needs it).
development:
  liveness_evaluation:
    class: LivenessEvaluationJob
    schedule: every minute
  rollout_timeouts:
    class: RolloutTimeoutJob
    schedule: every minute
  onboarding_pruning:
    class: OnboardingPruneJob
    schedule: every hour at minute 7
  # P2-S03: report requests no report satisfied within an hour become expired (kept, not deleted).
  report_request_expiry:
    class: ReportRequestExpiryJob
    schedule: every minute
  # P3-S05: tasks still waiting at their expiry are expired (AC-3.8); task leases that ran out are ended (AC-3.5).
  task_expiry:
    class: TaskExpiryJob
    schedule: every minute
  task_leases:
    class: TaskLeaseJob
    schedule: every minute
  # #194: live refreshes left pending with no flush coming (a lost or failed flush job) are scheduled again.
  live_refresh_sweep:
    class: LiveRefreshSweepJob
    schedule: every minute
  # P2-D06: rules file previews are kept 15 minutes (owner decision Q13); expired ones are deleted here.
  rule_import_preview_pruning:
    class: RuleImportPreviewPruneJob
    schedule: every 5 minutes
  # NFR-2, DEC-07: snapshots, report ids, and status events past the retention window; never audit entries.
  retention_pruning:
    class: RetentionPruneJob
    schedule: every day at 3:17am
  # #195, ADR 0027: partitions of the history tables created ahead, and those past the window retired (dropped whole,
  # each host's newest row moved forward first). No DDL while a backup runs; work it cannot do now waits an hour.
  partition_maintenance:
    class: PartitionMaintenanceJob
    schedule: every hour at minute 23
  # #195, ADR 0027: the history tables have no foreign keys; rows written since the last check whose host or rule is
  # missing are logged as an error.
  partition_check:
    class: PartitionCheckJob
    schedule: every day at 4:41am
  # P2-D06: uploaded advisory files never imported (a job interrupted or never run) are deleted after an hour.
  advisory_upload_pruning:
    class: AdvisoryUploadPruneJob
    schedule: every 10 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  # FR-1.4: at least once a minute.
  liveness_evaluation:
    class: LivenessEvaluationJob
    schedule: every minute
  # DEC-17: expired onboarding requests are removed a day after they expire.
  rollout_timeouts:
    class: RolloutTimeoutJob
    schedule: every minute
  onboarding_pruning:
    class: OnboardingPruneJob
    schedule: every hour at minute 7
  # P2-S03: report requests no report satisfied within an hour become expired (kept, not deleted).
  report_request_expiry:
    class: ReportRequestExpiryJob
    schedule: every minute
  # P3-S05: tasks still waiting at their expiry are expired (AC-3.8); task leases that ran out are ended (AC-3.5).
  task_expiry:
    class: TaskExpiryJob
    schedule: every minute
  task_leases:
    class: TaskLeaseJob
    schedule: every minute
  # #194: live refreshes left pending with no flush coming (a lost or failed flush job) are scheduled again.
  live_refresh_sweep:
    class: LiveRefreshSweepJob
    schedule: every minute
  # P2-D06: rules file previews are kept 15 minutes (owner decision Q13); expired ones are deleted here.
  rule_import_preview_pruning:
    class: RuleImportPreviewPruneJob
    schedule: every 5 minutes
  # NFR-2, DEC-07: snapshots, report ids, and status events past the retention window; never audit entries.
  retention_pruning:
    class: RetentionPruneJob
    schedule: every day at 3:17am
  # #195, ADR 0027: partitions of the history tables created ahead, and those past the window retired (dropped whole,
  # each host's newest row moved forward first). No DDL while a backup runs; work it cannot do now waits an hour.
  partition_maintenance:
    class: PartitionMaintenanceJob
    schedule: every hour at minute 23
  # #195, ADR 0027: the history tables have no foreign keys; rows written since the last check whose host or rule is
  # missing are logged as an error.
  partition_check:
    class: PartitionCheckJob
    schedule: every day at 4:41am
  # P2-S13, DEC-11: advisory data from FLEET_ADVISORY_FEED_URL (does nothing when it is empty). Not in
  # development, so a laptop does not download the archive every 6 hours: run bin/rails advisories:refresh.
  advisory_feed_refresh:
    class: AdvisoryFeedRefreshJob
    schedule: "41 */6 * * *"
  # P2-S16, ADR 0022: Debian's triage from FLEET_DEBIAN_TRACKER_URL (does nothing when it is empty), at the same
  # cadence, 15 minutes after the OSV refresh. Its own job, so its failures never hold up OSV or matching.
  debian_triage_refresh:
    class: DebianTriageRefreshJob
    schedule: "56 */6 * * *"
  # VT-S02 (#257, ADR 0032): CISA KEV from FLEET_KEV_URL (does nothing when it is empty), every 6 hours, 30 minutes after
  # the advisory refresh. Its own job, so its failures never hold up the advisory data, triage, or matching.
  kev_refresh:
    class: KevRefreshJob
    schedule: "11 1-23/6 * * *"
  # VT-S03 (#257): FIRST EPSS from FLEET_EPSS_URL (does nothing when it is empty), daily at 14:30 UTC (scores are published
  # shortly after 13:30 UTC), whatever the server's time zone.
  epss_refresh:
    class: EpssRefreshJob
    schedule: "30 14 * * * UTC"
  # VT-S05 (#259, ADR 0032): EPSS band and Debian tracker changes re-triaged once a day, an hour after the EPSS refresh.
  triage_daily:
    class: TriageDailyJob
    schedule: "37 15 * * * UTC"
  # VT-S05 (#259, owner decision 2026-11-21): hosts whose listener evidence (rule N5) turned 24 hours old are
  # re-triaged. Does nothing until VT-APPLICABILITY (#258) supplies the evidence.
  triage_listener_expiry:
    class: TriageListenerExpiryJob
    schedule: every hour at minute 19
  # Reviews of #277: triage runs whose job died with its worker are resumed (failed after 3 in a row with no progress).
  triage_run_watch:
    class: TriageRunWatchJob
    schedule: every 10 minutes
  # P2-D06: uploaded advisory files never imported (a job interrupted or never run) are deleted after an hour.
  advisory_upload_pruning:
    class: AdvisoryUploadPruneJob
    schedule: every 10 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
