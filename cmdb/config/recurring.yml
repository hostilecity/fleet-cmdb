# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Recurring jobs run by Solid Queue's scheduler. Later issues add their jobs here
# (for example the liveness evaluation job, one entry per environment that needs it).
development:
  liveness_evaluation:
    class: LivenessEvaluationJob
    schedule: every minute
  rollout_timeouts:
    class: RolloutTimeoutJob
    schedule: every minute
  onboarding_pruning:
    class: OnboardingPruneJob
    schedule: every hour at minute 7
  # NFR-2, DEC-07: snapshots, report ids, and status events past the retention window; never audit entries.
  retention_pruning:
    class: RetentionPruneJob
    schedule: every day at 3:17am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  # FR-1.4: at least once a minute.
  liveness_evaluation:
    class: LivenessEvaluationJob
    schedule: every minute
  # DEC-17: expired onboarding requests are removed a day after they expire.
  rollout_timeouts:
    class: RolloutTimeoutJob
    schedule: every minute
  onboarding_pruning:
    class: OnboardingPruneJob
    schedule: every hour at minute 7
  # NFR-2, DEC-07: snapshots, report ids, and status events past the retention window; never audit entries.
  retention_pruning:
    class: RetentionPruneJob
    schedule: every day at 3:17am
  # P2-S13, DEC-11: advisory data from FLEET_ADVISORY_FEED_URL (does nothing when it is empty). Not in
  # development, so a laptop does not download the archive every 6 hours: run bin/rails advisories:refresh.
  advisory_feed_refresh:
    class: AdvisoryFeedRefreshJob
    schedule: "41 */6 * * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
