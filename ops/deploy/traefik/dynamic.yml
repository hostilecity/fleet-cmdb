# Traefik routing (P1-O03, ADR 0005), mounted read-only by compose.yaml. Traefik expands the Go template below
# (with Sprig functions) from its environment, so the hostnames and the tunnel range come from .env.
#
# - Entrypoint websecure (:443, the LAN): only FLEET_AGENT_HOST is routed, to the app. Rails then serves only
#   /api/v1 and the health paths on that hostname (cmdb/lib/middleware/host_separation.rb).
# - Entrypoint dashboard (:8443): only when FLEET_TUNNEL_SOURCE_RANGE is set, and only from those addresses (the
#   machine running the Cloudflare tunnel connector), FLEET_DASHBOARD_HOST is routed to the app. Rails serves the
#   dashboard there, never /api/v1 or health. Clients outside the range get 403.
#
# Any other name, or a hostname on the other entrypoint, gets Traefik's 404. Neither entrypoint trusts a client's
# X-Forwarded-* headers (compose.yaml sets no forwardedHeaders options), so Traefik replaces them with its own:
# X-Forwarded-Host is always the hostname the router matched. Rails trusts Traefik's forwarded headers
# (FLEET_TRUSTED_PROXIES), and Traefik leaves Forwarded and Client-IP alone, so strip-forwarded removes those two:
# Rack would otherwise take the host and client address from a Forwarded header the client wrote.
http:
  routers:
    agent-api:
      rule: 'Host(`{{ env "FLEET_AGENT_HOST" }}`)'
      entryPoints: [websecure]
      middlewares: [strip-forwarded]
      service: cmdb-app
      tls:
        certResolver: letsencrypt
{{- $tunnel := env "FLEET_TUNNEL_SOURCE_RANGE" | trim }}
{{- if $tunnel }}
    dashboard:
      rule: 'Host(`{{ env "FLEET_DASHBOARD_HOST" }}`)'
      entryPoints: [dashboard]
      middlewares: [tunnel-only, strip-forwarded, public-https-port]
      service: cmdb-app
      tls:
        certResolver: letsencrypt
{{- end }}
  middlewares:
    # An empty value removes the header.
    strip-forwarded:
      headers:
        customRequestHeaders:
          Forwarded: ""
          Client-IP: ""
{{- if $tunnel }}
    # The client's own address (no ipStrategy: X-Forwarded-For is never read).
    tunnel-only:
      ipAllowList:
        sourceRange:
{{- range $range := splitList "," $tunnel }}
          - '{{ trim $range }}'
{{- end }}
    # Browsers reach the dashboard on 443 at Cloudflare, not on this entrypoint's port: say so to Rails, so its
    # redirects and the OAuth callback URL carry no port.
    public-https-port:
      headers:
        customRequestHeaders:
          X-Forwarded-Port: "443"
{{- end }}
  services:
    cmdb-app:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://app:3000"

tls:
  options:
    default:
      minVersion: VersionTLS12
